<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2E7D4F">
<title>PYTHA — Pythagoras Team Challenge</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;-webkit-font-smoothing:antialiased}
:root{
  --font:'Baloo 2','Nunito',system-ui,-apple-system,sans-serif;
  --body-font:'Nunito',system-ui,-apple-system,sans-serif;
  --radius:28px;--radius-sm:18px;
  --shadow:0 6px 0 var(--line),0 8px 22px rgba(0,0,0,.10);
  --shadow-lg:0 10px 0 var(--line),0 16px 36px rgba(0,0,0,.16);
  --ok:#558B2F;--ok-soft:#E3F0D3;--no:#C62828;--no-soft:#FDE3E1;
}
:root,:root[data-theme="green"]{
  --primary:#2E7D4F;--primary-2:#5FAE7A;--primary-dark:#1F4D33;
  --soft:#E3F1E6;--bg:#FAF6EC;--dot:#EFE6D2;--card:#FFFDF8;
  --text:#3A2E22;--muted:#6B5B45;--line:#D9CBB0;--accent:#D9CBF3;
  --gold:#C4AEEB;--gold-dark:#7E57C2;
  --brown:#7A5230;--brown-dark:#4E3420;--beige:#F1E7D3;--purple:#7E57C2;--purple-soft:#E9E0F7;--secondary:#7A5230;
}
:root[data-theme="purple"]{
  --primary:#7E57C2;--primary-2:#B39DDB;--primary-dark:#4527A0;
  --soft:#EDE7F6;--bg:#FAF7FD;--dot:#EADFF7;--card:#FFFEFF;
  --text:#32264A;--muted:#6E5F8A;--line:#D9CFEA;--accent:#FFE0B2;
  --gold:#FFB74D;--gold-dark:#E65100;
  --brown:#7A5230;--brown-dark:#4E3420;--beige:#F1E7D3;--purple:#7E57C2;--purple-soft:#EDE7F6;--secondary:#2E7D4F;
}
:root[data-theme="orange"]{
  --primary:#EF6C00;--primary-2:#FFA726;--primary-dark:#A84300;
  --soft:#FFF0DC;--bg:#FFF9F0;--dot:#FFE9CC;--card:#FFFDF8;
  --text:#3A2A1A;--muted:#7D6446;--line:#F0D9BC;--accent:#E1D4F5;
  --gold:#B39DDB;--gold-dark:#5E35B1;
  --brown:#7A5230;--brown-dark:#4E3420;--beige:#F1E7D3;--purple:#7E57C2;--purple-soft:#E9E0F7;--secondary:#2E7D4F;
}
:root[data-theme="yellow"]{
  --primary:#B86E00;--primary-2:#F2A900;--primary-dark:#6B4000;
  --soft:#FFEFB0;--bg:#FFFAE6;--dot:#FFEDB0;--card:#FFFEF7;
  --text:#4A3300;--muted:#8A6A1F;--line:#EFD27C;--accent:#FFD54F;
  --gold:#FFC107;--gold-dark:#E09B00;
}
:root[data-theme="pink"]{
  --primary:#C2185B;--primary-2:#F06292;--primary-dark:#7A0F3D;
  --soft:#FFE0EE;--bg:#FFF5FA;--dot:#FFE1EF;--card:#FFFCFE;
  --text:#5B1236;--muted:#9D4B73;--line:#F4B6D2;--accent:#FBCFE8;
  --gold:#F48FB1;--gold-dark:#D81B60;
}
:root[data-theme="blue"]{
  --primary:#1565C0;--primary-2:#42A5F5;--primary-dark:#0D3C75;
  --soft:#DCEBFF;--bg:#F3F8FF;--dot:#DCEAFF;--card:#FDFEFF;
  --text:#0F2A4F;--muted:#4F6B8F;--line:#B7D2F4;--accent:#BBDEFB;
  --gold:#64B5F6;--gold-dark:#1E88E5;
}
body{
  font-family:var(--body-font);color:var(--text);
  background-color:var(--bg);
  background-image:radial-gradient(var(--dot) 1.8px,transparent 1.8px);
  background-size:24px 24px;min-height:100vh;
}
h1,h2,h3,h4{font-family:var(--font);letter-spacing:.2px;margin:0}
p{margin:0}
button{font-family:inherit}
input,textarea{font-family:inherit}

/* ---------- TOPBAR = expedition header ---------- */
.topbar{
  position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:10px;justify-content:space-between;
  padding:14px 16px;background:linear-gradient(145deg,var(--primary-dark),var(--primary),var(--primary-2));
  border-radius:0 0 32px 32px;border-bottom:5px solid var(--accent);
  box-shadow:0 10px 0 var(--primary-dark),0 8px 25px rgba(78,47,29,.3);flex-wrap:wrap;position:relative;overflow:hidden;
}
.topbar::before{content:'';position:absolute;top:-30px;right:-30px;width:120px;height:120px;background:rgba(255,255,255,.08);border-radius:50%;pointer-events:none}
.brand{display:flex;align-items:center;gap:10px;min-width:0;position:relative;z-index:2}
.brand-logo{
  width:44px;height:44px;border-radius:50%;flex:0 0 auto;
  background:rgba(255,255,255,.18);border:3px solid #fff;
  color:#fff;font-family:var(--font);font-weight:800;font-size:21px;
  display:grid;place-items:center;box-shadow:0 5px 0 rgba(0,0,0,.15);
}
.brand-text{min-width:0}
.brand-title{font-family:var(--font);font-weight:800;font-size:15px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff;text-shadow:2px 2px 0 rgba(0,0,0,.2)}
.brand-sub{font-size:11px;color:rgba(255,255,255,.85);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-style:italic}
.greet{
  font-family:var(--font);font-weight:800;font-size:13.5px;
  background:rgba(255,255,255,.16);color:#fff;
  padding:7px 14px;border-radius:999px;white-space:nowrap;
  border:2px solid rgba(255,255,255,.4);max-width:42vw;overflow:hidden;text-overflow:ellipsis;position:relative;z-index:2;
}
.topbar-tools{display:flex;align-items:center;gap:7px;flex:0 0 auto;position:relative;z-index:2}
.seg{display:flex;background:rgba(255,255,255,.16);border-radius:999px;padding:3px;gap:2px;border:2px solid rgba(255,255,255,.35)}
.seg button{
  border:none;background:transparent;color:rgba(255,255,255,.85);font-weight:800;font-size:12px;
  padding:6px 11px;border-radius:999px;cursor:pointer;transition:.18s;
}
.seg button.active{background:var(--accent);color:var(--primary-dark);box-shadow:0 3px 0 var(--gold-dark)}
.iconbtn{
  width:38px;height:38px;border-radius:50%;border:2px solid rgba(255,255,255,.4);background:rgba(255,255,255,.14);
  cursor:pointer;display:grid;place-items:center;font-size:16px;transition:.18s;padding:0;color:#fff;
}
.iconbtn.on{background:var(--accent);color:var(--primary-dark);border-color:#fff;box-shadow:0 3px 0 var(--gold-dark)}

/* ---------- TABS = quick-nav pills ---------- */
.tabs{
  display:flex;gap:6px;overflow-x:auto;padding:0;margin:10px 10px 0;scrollbar-width:none;max-width:1000px;
  margin-left:auto;margin-right:auto;
  background:var(--card);border-radius:50px;border:3px solid var(--accent);
  box-shadow:0 6px 0 var(--line),0 4px 16px rgba(0,0,0,.08);padding:6px 8px;
  position:sticky;top:8px;z-index:55;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:0 0 auto;border:2px solid #fff;background:linear-gradient(180deg,var(--soft),#F4C978);color:var(--primary-dark);
  padding:8px 13px;border-radius:999px;cursor:pointer;font-family:var(--font);
  font-weight:800;font-size:12.5px;display:flex;align-items:center;gap:5px;transition:.15s;
  box-shadow:0 4px 0 var(--primary),inset 0 1px 0 rgba(255,255,255,.5);white-space:nowrap;
}
.tab:active{transform:translateY(3px);box-shadow:0 1px 0 var(--primary)}
.tab.active{background:linear-gradient(180deg,var(--accent),var(--gold));border-color:#fff;box-shadow:0 4px 0 var(--gold-dark);transform:scale(1.04)}

.view{max-width:1000px;margin:0 auto;padding:14px 12px 90px;animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes starPop{0%{transform:scale(0) rotate(-200deg);opacity:0}60%{transform:scale(1.3) rotate(12deg)}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes popIn{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}

/* ---------- CARDS = adventure-card ---------- */
.card{
  background:var(--card);border:3px solid #fff;border-radius:var(--radius);
  box-shadow:0 8px 0 var(--line),0 8px 24px rgba(107,66,38,.12);padding:20px;
}
.stack{display:flex;flex-direction:column;gap:16px}
.section-title{font-size:19px;font-weight:800;display:flex;align-items:center;gap:9px;margin-bottom:6px;color:var(--primary-dark)}
.section-desc{color:var(--muted);font-size:14px;line-height:1.65}
.muted{color:var(--muted)}

/* ---------- HERO = story card ---------- */
.hero{
  background:linear-gradient(160deg,var(--soft),var(--card) 75%);
  border:3px solid #fff;border-radius:var(--radius);
  padding:22px;display:flex;gap:18px;align-items:center;box-shadow:0 8px 0 var(--line),0 8px 24px rgba(107,66,38,.14);
  position:relative;overflow:hidden;
}
.hero::after{content:'';position:absolute;right:-40px;top:-40px;width:170px;height:170px;border-radius:50%;background:var(--primary-2);opacity:.16}
.hero-text{flex:1;min-width:0;position:relative;z-index:2}
.hero h1{font-size:26px;line-height:1.18;font-weight:800;color:var(--primary-dark);text-shadow:1px 1px 0 #fff}
.hero h1 span{color:var(--primary)}
.hero p{margin-top:10px;color:var(--muted);font-size:14px;line-height:1.65}
.hero-cta{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.vara-wrap{flex:0 0 auto;width:140px;position:relative;z-index:2;animation:bob 3s ease-in-out infinite}
.vara-wrap svg,.vara-wrap img{width:100%;height:auto;display:block;filter:drop-shadow(0 14px 16px rgba(107,66,38,.25))}
.vara-wrap img{border-radius:18px}
@media(max-width:640px){
  .hero{flex-direction:column-reverse;text-align:center;padding:18px}
  .hero-cta{justify-content:center}
  .vara-wrap{width:120px}
  .hero h1{font-size:21px}
}

/* ---------- BUTTONS = discovery-btn / btn-explore ---------- */
.btn{
  font-family:var(--font);font-weight:800;font-size:14.5px;border:2px solid #fff;border-radius:999px;
  padding:12px 22px;cursor:pointer;background:linear-gradient(135deg,var(--primary-2),var(--primary));color:#fff;
  box-shadow:0 6px 0 var(--primary-dark),0 6px 18px rgba(193,68,14,.25);transition:transform .12s,box-shadow .12s,opacity .15s;
  display:inline-flex;align-items:center;gap:8px;justify-content:center;
}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--primary-dark)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.btn.ghost{background:#fff;color:var(--primary-dark);border:2px solid var(--line);box-shadow:0 5px 0 var(--line)}
.btn.ghost:active{box-shadow:0 1px 0 var(--line)}
.btn.small{padding:9px 16px;font-size:12.5px;box-shadow:0 4px 0 var(--primary-dark)}
.btn.small:active{box-shadow:0 1px 0 var(--primary-dark)}
.btn.ghost.small{box-shadow:0 4px 0 var(--line)}
.btn.ghost.small:active{box-shadow:0 1px 0 var(--line)}
.btn.big{padding:14px 28px;font-size:16px}
.btn.green{background:linear-gradient(135deg,#8BC34A,var(--ok));box-shadow:0 6px 0 #33691E}
.btn.green:active{box-shadow:0 1px 0 #33691E}

/* ---------- INFO CARD = inquiry-guide ---------- */
.info-card{
  background:linear-gradient(135deg,var(--bg),var(--soft));border:3px dashed var(--line);border-radius:var(--radius);
  box-shadow:inset 0 2px 12px rgba(193,68,14,.06),0 4px 0 rgba(107,66,38,.08);padding:18px 20px;position:relative;overflow:hidden;
}
.info-card h3{font-size:17px;display:flex;align-items:center;gap:9px;margin-bottom:10px;color:var(--primary-dark)}
.info-card p{font-size:13.5px;line-height:1.75;color:var(--text);text-align:justify}
.info-card .hl{background:linear-gradient(180deg,transparent 55%,var(--accent) 55%);font-weight:800;padding:0 2px}
.tp-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.tp-list li{display:flex;gap:10px;font-size:13.5px;line-height:1.7;background:rgba(255,255,255,.65);padding:8px 10px;border-radius:16px;border:2px dashed var(--line)}
.tp-num{
  flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--primary-2),var(--primary));color:#fff;
  font-family:var(--font);font-weight:800;font-size:13.5px;display:grid;place-items:center;
  box-shadow:0 3px 0 var(--primary-dark);border:2px solid #fff;
}

/* ---------- MAP ---------- */
.map-container{
  overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--radius);
  border:3px solid #fff;background:var(--card);box-shadow:0 8px 0 var(--line),0 8px 22px rgba(107,66,38,.12);
  padding:8px;
}
.map-svg{min-width:720px;width:100%;height:auto;display:block;border-radius:16px}
.map-stop{cursor:pointer;transition:.2s}
.map-stop:hover .pin-ring{transform:scale(1.08)}
.pin-ring{transition:.25s;transform-origin:center}
.vara-marker{animation:bob 2.2s ease-in-out infinite}

.stop-list{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.stop-mini{
  display:flex;align-items:center;gap:12px;padding:12px 14px;border:3px solid var(--line);
  border-radius:var(--radius-sm);background:var(--card);cursor:pointer;transition:.15s;
  box-shadow:0 4px 0 var(--line);
}
.stop-mini:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.stop-mini.locked{opacity:.55;cursor:not-allowed}
.stop-mini.done{border-color:var(--ok);background:linear-gradient(90deg,var(--ok-soft),var(--card) 60%);box-shadow:0 4px 0 var(--ok)}
.stop-mini .ico{font-size:24px;flex:0 0 auto}
.stop-mini .info{flex:1;min-width:0}
.stop-mini .info h4{font-size:14px;font-family:var(--font);color:var(--primary-dark)}
.stop-mini .info p{font-size:11.5px;color:var(--muted);margin-top:2px}
.stop-mini .badge2{
  font-size:10.5px;font-weight:800;padding:4px 10px;border-radius:999px;
  background:var(--soft);color:var(--primary-dark);flex:0 0 auto;border:2px solid #fff;
}
.stop-mini.done .badge2{background:var(--ok);color:#fff}
.stop-mini.current .badge2{background:var(--primary);color:#fff}

/* ---------- PHASE = adventure-card section ---------- */
.phase{background:var(--card);border:3px solid #fff;border-radius:var(--radius);box-shadow:0 8px 0 var(--line),0 8px 22px rgba(107,66,38,.12);overflow:hidden}
.phase-head{display:flex;align-items:center;gap:12px;padding:14px 18px;background:linear-gradient(135deg,var(--soft),transparent 90%);border-bottom:3px solid var(--line)}
.phase-num{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--primary-2),var(--primary));color:#fff;display:grid;place-items:center;font-family:var(--font);font-weight:800;font-size:16px;flex:0 0 auto;box-shadow:0 4px 0 var(--primary-dark);border:2px solid #fff}
.phase-head h3{font-size:16.5px;color:var(--primary-dark)}
.phase-head .phase-hint{font-size:12px;color:var(--muted);font-family:var(--body-font);font-weight:700}
.phase-body{padding:18px}

.balance-stage{display:grid;grid-template-columns:1fr;gap:16px;align-items:start}
@media(min-width:720px){.balance-stage{grid-template-columns:1.05fr 1fr}}
.balance-svg{width:100%;height:auto;display:block;max-height:280px}
.bal-note{text-align:center;font-family:var(--font);font-weight:800;font-size:15px;padding:10px 14px;border-radius:14px;margin-top:10px;border:2px solid transparent}
.bal-note.ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.bal-note.no{background:var(--soft);color:var(--primary-dark);border-color:var(--line)}

.slider-wrap{margin-top:8px;background:var(--bg);border:2px dashed var(--line);border-radius:18px;padding:12px 14px}
.slider-label{display:flex;justify-content:space-between;font-family:var(--font);font-weight:800;font-size:13.5px;margin-bottom:6px;color:var(--primary-dark)}
.slider-label .x-val{color:var(--primary);font-size:19px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:12px;border-radius:999px;background:linear-gradient(90deg,var(--primary-2),var(--soft));outline:none;cursor:pointer;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.12)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:28px;height:28px;border-radius:50%;background:var(--primary);border:4px solid #fff;cursor:pointer;box-shadow:0 4px 0 var(--primary-dark)}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--primary);border:4px solid #fff;cursor:pointer;box-shadow:0 4px 0 var(--primary-dark)}
.slider-scale{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);margin-top:4px;font-weight:700}

.graph-wrap{background:var(--card);border:2px solid var(--line);border-radius:var(--radius-sm);padding:10px;margin-top:12px}
.graph-legend{display:flex;gap:12px;justify-content:center;font-size:11px;font-weight:800;margin-top:6px;flex-wrap:wrap;color:var(--primary-dark)}
.legend-dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:-1px;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.1)}

/* ---------- QUIZ = qa-zone ---------- */
.q-box{border:3px solid var(--line);border-radius:var(--radius-sm);padding:15px 16px;background:linear-gradient(160deg,var(--card),var(--bg),var(--soft));margin-top:12px}
.q-box.ok{border-color:var(--ok);background:linear-gradient(180deg,var(--ok-soft),var(--card) 60%)}
.q-box.no{border-color:var(--no);background:linear-gradient(180deg,var(--no-soft),var(--card) 60%)}
.q-num{font-size:11px;font-weight:800;color:var(--primary);letter-spacing:.8px;text-transform:uppercase}
.q-text{font-size:14.5px;line-height:1.6;margin-top:6px;font-weight:700;color:var(--text)}
.q-options{display:grid;gap:8px;margin-top:12px}
.opt{display:flex;align-items:center;gap:11px;border:2px solid var(--line);border-radius:16px;padding:11px 14px;cursor:pointer;transition:.15s;background:#fff;font-weight:700;font-size:14px;font-family:var(--font);box-shadow:0 3px 0 var(--line)}
.opt:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.opt input{accent-color:var(--primary);width:17px;height:17px;flex:0 0 auto}
.opt.sel{border-color:var(--primary);background:var(--soft)}
.opt.right{border-color:var(--ok);background:linear-gradient(135deg,#C5E1A5,#AED581);box-shadow:0 3px 0 #558B2F;color:#33691E}
.opt.wrongpick{border-color:var(--no);background:linear-gradient(135deg,#FFCDD2,#EF9A9A);box-shadow:0 3px 0 #C62828;color:#B71C1C}
input.ans{font-family:var(--font);font-weight:700;font-size:16px;padding:11px 15px;border-radius:14px;border:2px solid var(--line);background:#fff;color:var(--text);width:100%;max-width:240px;outline:none;transition:.18s}
input.ans:focus{border-color:var(--primary)}
.feedback{margin-top:11px;border-radius:13px;padding:11px 14px;font-size:13px;line-height:1.6;font-weight:700}
.feedback.ok{background:var(--ok-soft);color:var(--ok)}
.feedback.no{background:var(--no-soft);color:var(--no)}
.feedback.info{background:var(--soft);color:var(--primary-dark)}
.q-actions{display:flex;gap:9px;margin-top:12px;flex-wrap:wrap}

textarea.reflect{width:100%;min-height:110px;border:2px solid var(--line);border-radius:16px;padding:13px 15px;font-size:14px;line-height:1.6;resize:vertical;outline:none;background:var(--bg);color:var(--text);font-family:var(--body-font);font-weight:600}
textarea.reflect:focus{border-color:var(--primary);background:var(--card)}

/* ---------- STATS ---------- */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.stat{background:var(--card);border:3px solid #fff;border-radius:var(--radius-sm);padding:16px;text-align:center;box-shadow:0 6px 0 var(--line),0 6px 18px rgba(107,66,38,.1)}
.stat .num{font-family:var(--font);font-size:27px;font-weight:800;color:var(--primary);line-height:1}
.stat .lbl{font-size:11.5px;color:var(--muted);margin-top:6px;font-weight:700}
.stat .ico{font-size:20px}
.bar{height:12px;border-radius:999px;background:var(--soft);overflow:hidden;margin-top:8px;border:2px solid #fff}
.bar > i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--primary-2),var(--primary));transition:width .6s}
.list-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1.5px dashed var(--line);font-size:13.5px}
.list-row:last-child{border-bottom:none}
.tick{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;background:var(--soft);color:var(--muted);flex:0 0 auto;border:2px solid #fff}

/* ---------- SETTINGS ---------- */
.set-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1.5px dashed var(--line);flex-wrap:wrap}
.set-row:last-child{border-bottom:none}
.set-label{font-family:var(--font);font-weight:800;font-size:14.5px;color:var(--primary-dark)}
.set-hint{font-size:12px;color:var(--muted);margin-top:2px}

/* ---------- STARS & PROGRESS TRACK ---------- */
.star-bar{display:flex;justify-content:center;gap:5px;margin:4px 0 2px;flex-wrap:wrap}
.star{font-size:22px;opacity:.2;filter:grayscale(1);transition:all .3s}
.star.earned{opacity:1;filter:grayscale(0);animation:starPop .55s cubic-bezier(.175,.885,.32,1.275)}
.progress-track{display:flex;align-items:center;justify-content:center;margin:4px 0;gap:2px}
.progress-node{width:22px;height:22px;border-radius:50%;background:var(--soft);border:2px solid #fff;box-shadow:0 2px 0 var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.62rem;color:#fff;font-weight:800}
.progress-node.done{background:linear-gradient(135deg,var(--accent),var(--gold));border-color:#FFF9C4;color:var(--primary-dark);box-shadow:0 2px 0 var(--primary)}
.progress-node.current{background:linear-gradient(135deg,var(--primary-2),var(--primary));border-color:#FFF9C4;box-shadow:0 0 0 5px rgba(193,68,14,.22),0 2px 0 var(--primary-dark);color:#fff;width:24px;height:24px}
.progress-connector{flex:1;min-width:6px;height:4px;background:var(--soft);border-radius:2px;margin:0 2px}
.progress-connector.done{background:linear-gradient(90deg,var(--accent),var(--gold))}

/* ---------- CELEBRATE / TOAST ---------- */
.celebrate{background:linear-gradient(145deg,var(--primary-dark),var(--primary));color:#fff;border-radius:var(--radius);padding:24px;text-align:center;box-shadow:var(--shadow-lg);border:3px solid var(--accent)}
.celebrate h2{font-size:23px;text-shadow:2px 2px 0 rgba(0,0,0,.2)}
.celebrate p{margin-top:8px;opacity:.95;font-size:14px;line-height:1.65}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);background:var(--primary-dark);color:#fff;padding:12px 22px;border-radius:999px;font-weight:700;font-size:13px;box-shadow:0 16px 40px rgba(0,0,0,.3);z-index:200;opacity:0;transition:.35s cubic-bezier(.4,1.4,.5,1);pointer-events:none;font-family:var(--font);max-width:90vw;text-align:center;border:2px solid var(--accent)}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

.stop-city{font-size:12px;font-weight:800;color:var(--primary);letter-spacing:.4px;text-transform:uppercase}
.stop-intro{font-size:14px;line-height:1.65;color:var(--text)}

.footer{max-width:1000px;margin:0 auto;padding:8px 16px 34px;text-align:center;font-size:12px;color:var(--muted);line-height:1.7}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}}

.p-pump-head{font-family:var(--font);font-weight:800;text-align:center;font-size:16px;letter-spacing:1px}
.p-screen{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#1B1B1B;border-radius:12px;padding:10px;margin:8px 0 12px;border:3px solid #555}
.p-screen div{display:flex;flex-direction:column}.p-screen .wide{grid-column:1/-1}
.p-screen small{font-size:10.5px;color:#9E9E9E;font-weight:800;letter-spacing:1px}
.p-screen b{font-family:'Courier New',monospace;font-size:26px;color:#76FF03}
.p-pump input[type=range]{background:linear-gradient(90deg,#FFEB3B,#fff)}
.p-pump .slider-scale{color:#FFCDD2}
.p-side{display:flex;gap:12px;align-items:stretch}
.p-tank{position:relative;width:86px;min-height:170px;border:4px solid #607D8B;border-radius:18px;background:#ECEFF1;overflow:hidden;flex:0 0 auto}
.p-tank.big{width:120px;min-height:160px;margin:10px auto}
.p-fuel{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(180deg,#FFCA28,#FF8F00);transition:height .5s}
.p-fuel.fill-anim{animation:fillUp 1.2s ease-out}
@keyframes fillUp{from{height:0}}
.p-tank span{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-weight:800;font-size:12px;color:#37474F}
.p-wallet{flex:1;background:#fff;border:2.5px solid var(--line);border-radius:16px;padding:12px;font-size:14px;font-weight:700;display:flex;flex-direction:column;gap:8px}
.p-bars{display:flex;flex-direction:column;gap:6px}
.p-bar{position:relative;height:22px;background:#F1F1F1;border-radius:8px;overflow:hidden}
.p-bar i{display:block;height:100%;transition:width .3s}
.p-bar span{position:absolute;left:8px;top:2px;font-size:12px;font-weight:800;color:#222}
.p-status{font-weight:800;color:var(--muted)}.p-status.ok{color:var(--ok)}.p-status.over{color:var(--no)}
.p-log{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px}
.p-log .sub-label{width:100%}
.p-chip{background:#fff;border:2px solid var(--line);border-radius:999px;padding:4px 10px;font-weight:800;font-size:12.5px}
.p-chip.ok{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
/* Nganjuk */
.n-stage{background:linear-gradient(180deg,#FFF3E0,#EFEBE9);border:3px solid #D7CCC8;border-radius:20px;padding:14px}
.n-eq{text-align:center;font-family:var(--font);font-weight:800;font-size:26px;color:#4E342E;background:#fff;border:3px solid #8D6E63;border-radius:14px;padding:4px 12px;width:max-content;max-width:100%;margin:0 auto 10px}
.n-eq.bad{border-color:var(--no);color:var(--no)}
.n-balance{position:relative;height:250px;max-width:560px;margin:0 auto}
.n-beam{position:absolute;left:6%;right:6%;top:70px;height:10px;background:#5D4037;border-radius:6px;transition:transform .5s cubic-bezier(.4,1.4,.5,1);transform-origin:center}
.n-pan{position:absolute;top:10px;width:44%;display:flex;flex-direction:column;align-items:center;transition:transform .5s}
.n-pan.left{left:-6%}.n-pan.right{right:-6%}
.n-load{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;align-items:flex-end;min-height:80px;max-width:100%;padding:0 4px;transform:translateY(-100%);position:absolute;top:18px}
.n-dish{width:100%;height:16px;background:linear-gradient(180deg,#BCAAA4,#8D6E63);border-radius:0 0 60px 60px;margin-top:10px}
.n-cap{font-size:11px;font-weight:800;color:#6D4C41;margin-top:3px}
.n-post{position:absolute;left:50%;top:74px;width:14px;height:140px;background:#6D4C41;transform:translateX(-50%);border-radius:4px}
.n-base{position:absolute;left:50%;bottom:22px;width:120px;height:16px;background:#4E342E;transform:translateX(-50%);border-radius:8px}
.n-sack{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:42px;height:46px;background:#D84315;color:#fff;border-radius:12px 12px 16px 16px;font-size:18px;line-height:1;border:2px solid #fff;box-shadow:0 2px 0 #8C2A0B}
.n-sack b{font-family:var(--font);font-size:14px}
.n-kg{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 3px;background:#607D8B;color:#fff;font-size:10.5px;font-weight:800;border-radius:4px;border:1.5px solid #fff}
.n-kg.big{min-width:60px;height:40px;font-size:16px}
.n-legend{text-align:center;font-size:12.5px;font-weight:700;color:#5D4037;margin-top:-6px}
@media(max-width:480px){.n-balance{height:230px}.n-sack{width:34px;height:40px;font-size:15px}.n-kg{min-width:16px;height:16px;font-size:9px}.n-eq{font-size:22px}}
/* Jombang */
.j-bill{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
@media(max-width:560px){.j-bill{grid-template-columns:1fr}.j-same{text-align:center}}
.j-receipt{background:#fff;border:2px dashed #A5D6A7;border-radius:12px;padding:10px 12px;font-size:13.5px;font-weight:700;line-height:1.7;box-shadow:0 3px 0 #C8E6C9}
.j-receipt div{display:flex;justify-content:space-between;gap:6px}.j-receipt span{color:var(--muted)}
.j-same{font-family:var(--font);font-weight:800;color:#2E7D32;font-size:15px}
.j-slots{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;background:#1B5E20;border-radius:18px;padding:14px;border:4px solid #A1887F}
.j-slot{width:72px;height:60px;border-radius:12px;border:3px dashed rgba(255,255,255,.6);background:rgba(255,255,255,.1);color:#fff;font-family:var(--font);font-weight:800;font-size:22px;cursor:pointer}
.j-slot.full{background:#FFF8E1;color:#1B5E20;border-style:solid;border-color:#FFD54F}
.j-slot .muted{color:rgba(255,255,255,.7)}
.j-cards{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.j-card{min-width:62px;height:56px;padding:0 12px;border-radius:12px;border:3px solid #fff;background:linear-gradient(180deg,#FFF59D,#FFD54F);color:#3E2723;font-family:var(--font);font-weight:800;font-size:21px;cursor:grab;box-shadow:0 4px 0 #F9A825;touch-action:none;user-select:none;-webkit-user-select:none}
.j-card.used{display:inline-grid;place-items:center;opacity:.25;box-shadow:none;cursor:default}
@media(max-width:420px){.j-slot{width:58px;height:54px;font-size:19px}}
/* Malang */
.ml-dur{background:var(--bg);border:2px dashed var(--line);border-radius:18px;padding:12px 14px}
.ml-cards{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-top:12px}
.ml-card{border-radius:16px;padding:10px;text-align:center;color:#fff;font-weight:800;border:3px solid #fff}
.ml-card.a{background:linear-gradient(160deg,#42A5F5,#1565C0)}.ml-card.b{background:linear-gradient(160deg,#FF8A65,#D84315)}
.ml-card small{display:block;opacity:.9;font-size:12px}.ml-card b{font-family:var(--font);font-size:22px}
.ml-vs{font-family:var(--font);font-weight:800;font-size:13px;text-align:center;max-width:110px;color:var(--muted)}
.ml-vs.eq{color:var(--ok);font-size:15px;animation:popIn .3s}
.ml-flex{display:grid;gap:12px;margin-top:12px}
@media(min-width:720px){.ml-flex{grid-template-columns:1.4fr 1fr}}
.m-chart{width:100%;height:auto;display:block}
.ml-table{width:100%;border-collapse:collapse;font-size:13px;background:#fff;border-radius:14px;overflow:hidden;border:2px solid var(--line)}
.ml-table th{background:var(--soft);padding:7px;font-family:var(--font)}
.ml-table td{padding:6px 7px;text-align:center;border-top:1px solid #eee;font-weight:700}
.ml-table tr.cur td{background:#FFF8E1}.ml-table tr.eq td{background:var(--ok-soft);color:var(--ok)}
.ml-map{display:flex;flex-direction:column;gap:8px;background:var(--bg);border:2px dashed var(--line);border-radius:16px;padding:12px 14px;font-size:15px;margin-bottom:12px}
.ml-map .big{font-size:16px;font-weight:800}
.tag{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;color:#fff;font-weight:800;font-size:12px}
.tag.a{background:#1E88E5}.tag.b{background:#E65100}
/* Batu */
.b-scene{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;background:linear-gradient(180deg,#F3E5F5,#E8F5E9);border:3px solid #CE93D8;border-radius:18px;padding:14px;margin-bottom:12px}
.b-pan{background:#fff;border-radius:16px;padding:10px 14px;text-align:center;font-size:30px;border:2px solid #E1BEE7}
.b-pan .muted{font-size:12px;font-weight:700}
.b-eqs{font-weight:800;color:#6A1B9A;text-align:center;font-size:13px}
.b-create{background:linear-gradient(180deg,#FFF,#F3E5F5);border:3px dashed #BA68C8;border-radius:18px;padding:14px}
.b-nums{display:flex;gap:10px;flex-wrap:wrap}
.b-nums label{display:flex;flex-direction:column;gap:4px;font-weight:800;font-size:13px;color:var(--primary-dark)}
.b-preview{margin-top:12px;background:#fff;border:2px solid #E1BEE7;border-radius:14px;padding:12px;font-size:14.5px;line-height:1.7}
.b-sys{margin-top:8px;font-weight:800}
.b-sys .warn{color:#8A3B00}
/* Reward */
.reward{background:linear-gradient(160deg,var(--primary-dark),var(--primary));color:#fff;border-radius:var(--radius);padding:20px;text-align:center;border:3px solid var(--accent);box-shadow:var(--shadow-lg);animation:popIn .4s}
.rw-title{font-family:var(--font);font-weight:800;font-size:26px;text-shadow:2px 2px 0 rgba(0,0,0,.2)}
.rw-emo{font-family:var(--font);font-size:30px;font-weight:800;margin:10px 0}
.rw-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.rw-box{background:rgba(255,255,255,.95);color:var(--text);border-radius:18px;padding:12px 18px;min-width:150px}
.rw-box .muted{font-size:12px;font-weight:700}
.rw-badge{font-size:40px;animation:starPop .6s}
.road{position:relative;height:56px;margin:12px auto 0;max-width:520px;background:#455A64;border-radius:10px;overflow:hidden}
.road::before{content:'';position:absolute;left:0;right:0;top:26px;height:4px;background:repeating-linear-gradient(90deg,#fff 0 24px,transparent 24px 44px)}
.road-bus{position:absolute;top:6px;font-size:38px;animation:drive 2.6s ease-in-out infinite}
@keyframes drive{from{left:-70px}to{left:100%}}
.final-card p{margin-top:8px;font-size:15px;line-height:1.65}
.final-trophy{font-size:64px;animation:bob 2s ease-in-out infinite}
.big-badge{display:inline-block;margin-top:14px;background:linear-gradient(135deg,#FFE082,#FFB300);color:#4E2F1D;font-family:var(--font);font-weight:800;font-size:19px;padding:10px 20px;border-radius:999px;border:3px solid #fff;box-shadow:0 5px 0 #E65100;animation:popIn .6s}
/* Transisi */
.travel{position:fixed;inset:0;z-index:300;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55);padding:16px}
.travel.show{display:flex;animation:fade .25s}
.travel-box{width:min(560px,100%);background:linear-gradient(180deg,#81D4FA,#E1F5FE 55%,#A5D6A7 55%);border-radius:26px;border:4px solid #fff;overflow:hidden;text-align:center;padding-bottom:16px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.travel.final .travel-box{background:linear-gradient(180deg,#7E57C2,#B39DDB 55%,#81C784 55%)}
.travel-sky{height:70px;position:relative}
.travel-sun{position:absolute;right:26px;top:14px;font-size:40px}
.travel-mount{font-size:48px;padding-top:10px}
.travel-icons{font-size:28px;letter-spacing:10px;animation:scrollBg 3s linear infinite}
@keyframes scrollBg{from{transform:translateX(30px)}to{transform:translateX(-30px)}}
.travel-road{position:relative;height:56px;background:#455A64;margin-top:6px}
.travel-road::before{content:'';position:absolute;left:0;right:0;top:26px;height:4px;background:repeating-linear-gradient(90deg,#fff 0 24px,transparent 24px 44px);animation:roadMove .6s linear infinite}
@keyframes roadMove{from{background-position:0 0}to{background-position:-44px 0}}
.travel-bus{position:absolute;top:4px;font-size:42px;animation:busIn 3s ease-in-out forwards;transform:scaleX(-1)}
@keyframes busIn{from{left:-60px}to{left:calc(100% + 10px)}}
.travel-text{font-family:var(--font);font-weight:800;font-size:18px;color:#1B3A1B;padding:14px 16px 6px;line-height:1.45}
.final-ahead{font-family:var(--font);font-weight:800;font-size:24px;color:#fff;background:#B71C1C;display:inline-block;padding:6px 18px;border-radius:12px;margin:4px 0 10px;animation:popIn .5s .4s both;letter-spacing:1px}
.view.still{animation:none}



/* ================= PYTHAGORAS TEAM CHALLENGE (TGT) ================= */
.brand-logo{overflow:hidden;padding:0;background:#fff}
.brand-logo img{width:100%;height:100%;object-fit:cover;object-position:50% 20%;display:block}
.mode-chip{font-family:var(--font);font-weight:800;font-size:11px;padding:6px 11px;border-radius:999px;border:2px solid rgba(255,255,255,.55);background:rgba(255,255,255,.16);color:#fff;cursor:pointer;white-space:nowrap}
.mode-chip.rt{background:#2E7D32}
.tab{padding:5px 12px 5px 6px}
.tab .tico{width:30px;height:30px;border-radius:50%;object-fit:cover;object-position:35% 22%;border:2px solid #fff;background:#fff;flex:0 0 auto;display:block}
.tab.active .tico{box-shadow:0 0 0 2px var(--primary)}
.sec-ico{width:44px;height:44px;border-radius:50%;object-fit:cover;object-position:35% 22%;border:3px solid #fff;box-shadow:0 3px 0 var(--line);background:#fff;flex:0 0 auto}
.page-head{display:flex;align-items:center;gap:12px}
.page-head .sec-ico{width:64px;height:64px}
.page-head .section-title{margin:0}
.hero-art{flex:0 0 auto;width:210px;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;z-index:2}
.hero-art .pytho-hero{width:170px;border-radius:24px;border:4px solid #fff;box-shadow:0 8px 0 var(--line);animation:bob 3.2s ease-in-out infinite;background:#fff}
.hero-art svg{width:100%;height:auto}
.hero-logo{width:min(100%,360px);border-radius:20px;display:block;margin:0 auto 6px}
@media(max-width:640px){.hero-art{width:100%}.hero-art .pytho-hero{width:130px}}
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:9px}
.flow-step{border:3px solid var(--line);border-radius:18px;padding:8px 6px;text-align:center;background:var(--card);cursor:pointer;font-family:var(--font);font-weight:800;font-size:12.5px;color:var(--primary-dark);box-shadow:0 4px 0 var(--line);display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}
.flow-step img{width:48px;height:48px;border-radius:50%;object-fit:cover;object-position:35% 22%}
.flow-step.done{border-color:var(--ok);background:var(--ok-soft);box-shadow:0 4px 0 var(--ok)}
.flow-step.done::after{content:'✓';position:absolute;top:-8px;right:-6px;width:22px;height:22px;border-radius:50%;background:var(--ok);color:#fff;font-size:13px;display:grid;place-items:center;border:2px solid #fff}
.flow-step small{font-family:var(--body-font);font-weight:700;color:var(--muted);font-size:10.5px}
.stage-list{display:grid;gap:8px;margin-top:10px}
.stage-list div{display:block;background:#fff;border:2px dashed var(--line);border-radius:14px;padding:8px 12px;font-size:13.5px;line-height:1.55}
.stage-list b{font-family:var(--font);color:var(--primary)}.stage-list div>b:first-child{margin-right:6px}
.pill-nav{display:flex;gap:6px;flex-wrap:wrap}
.pill{border:2px solid var(--line);background:#fff;color:var(--primary-dark);font-family:var(--font);font-weight:800;font-size:12px;border-radius:999px;padding:6px 11px;cursor:pointer}
.pill.done{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.tri-box{background:var(--bg);border:2px dashed var(--line);border-radius:18px;padding:8px;text-align:center}
.tri-box svg{width:100%;height:auto;max-width:440px;display:inline-block}
.tri-choices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.tri-choice{border:3px solid var(--line);background:#fff;border-radius:16px;padding:6px;cursor:pointer;box-shadow:0 4px 0 var(--line);font-family:var(--font);font-weight:800;color:var(--primary-dark)}
.tri-choice svg{width:100%;height:auto;display:block}
.tri-choice.right{border-color:var(--ok);background:var(--ok-soft)}
.tri-choice.wrongpick{border-color:var(--no);background:var(--no-soft)}
.side-hit{cursor:pointer}
.sq-glow{animation:glow .9s ease-in-out 2}
@keyframes glow{0%,100%{filter:none}50%{filter:drop-shadow(0 0 7px #FFC107) brightness(1.15)}}
.areabar{margin-top:10px;display:grid;gap:6px}
.areabar .row{display:flex;height:30px;border-radius:10px;overflow:hidden;background:#EEE;border:2px solid #fff;box-shadow:0 2px 0 var(--line)}
.areabar .seg{height:100%;width:0;color:#fff;font-weight:800;font-family:var(--font);font-size:12.5px;display:flex;align-items:center;justify-content:center;transition:width .9s ease;white-space:nowrap;overflow:hidden}
.areabar.show .seg{width:var(--w)}
.areabar .cap{font-size:12px;font-weight:800;color:var(--muted)}
.eqline{font-family:var(--font);font-weight:800;font-size:20px;text-align:center;background:#fff;border:3px solid var(--primary);border-radius:16px;padding:8px 12px;margin-top:10px;animation:popIn .3s}
.steps-anim{display:flex;flex-direction:column;gap:4px;align-items:center;background:var(--bg);border:2px dashed var(--line);border-radius:18px;padding:10px;margin-top:10px;min-height:60px}
.steps-anim .st{font-family:var(--font);font-weight:800;font-size:20px;color:var(--primary-dark);animation:fadeUp .4s both}
.steps-anim .st.last{background:var(--ok-soft);color:var(--ok);border:3px solid var(--ok);border-radius:14px;padding:2px 14px}
.nums-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:8px}
.nums-row label{font-family:var(--font);font-weight:800;font-size:13.5px;display:flex;align-items:center;gap:6px;color:var(--primary-dark)}
.tbl{width:100%;border-collapse:collapse;font-size:13px;background:#fff;border-radius:14px;overflow:hidden;border:2px solid var(--line)}
.tbl th{background:var(--soft);padding:7px;font-family:var(--font);color:var(--primary-dark)}
.st10box{align-items:stretch}.st10box .st{font-size:14.5px;text-align:left;line-height:1.55;font-family:var(--font)}
.st10box .st.last{background:var(--ok-soft);color:var(--ok);border:3px solid var(--ok);border-radius:14px;padding:4px 12px}
.tbl.sp td{text-align:center;padding:6px 4px;border-top:1px solid var(--line);font-weight:700}.tbl.sp td:first-child{background:var(--soft);font-family:var(--font);color:var(--primary-dark)}
.tbl.sp tr.hl td{background:#FFF3C4}
.tbl td{padding:6px 7px;text-align:center;border-top:1px solid #eee;font-weight:700}
.tbl td.l,.tbl th.l{text-align:left}
.tbl tr.me td{background:var(--soft)}
.tbl td.ok{color:var(--ok)}
.scn-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.scn{border:2.5px solid var(--line);background:#fff;border-radius:14px;padding:9px;font-family:var(--font);font-weight:800;font-size:13px;color:var(--text);cursor:pointer;text-align:left;box-shadow:0 3px 0 var(--line)}
.scn.sel{border-color:var(--primary);background:var(--soft)}
.scn.ok{border-color:var(--ok);background:var(--ok-soft)}
/* TIM */
.role-grid{display:grid;gap:14px}
@media(min-width:700px){.role-grid{grid-template-columns:1fr 1fr}}
.role-card{text-align:center;cursor:pointer}
.role-card img{width:92px;height:92px;border-radius:50%;object-fit:cover;object-position:35% 22%;border:4px solid #fff;box-shadow:0 5px 0 var(--line)}
.code-big{font-family:var(--font);font-weight:800;font-size:42px;letter-spacing:4px;color:var(--primary);background:#fff;border:4px dashed var(--primary);border-radius:20px;padding:6px 18px;display:inline-block}
.team-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.team-card{background:var(--card);border:3px solid var(--line);border-radius:20px;padding:12px;box-shadow:0 5px 0 var(--line)}
.team-card h4{font-family:var(--font);font-size:16px;color:var(--primary-dark);display:flex;justify-content:space-between;align-items:center;gap:6px}
.team-card.mine{border-color:var(--primary);background:var(--soft)}
.mem{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;padding:5px 0;border-bottom:1.5px dashed var(--line)}
.mem:last-child{border:none}
.mem .no{width:26px;height:26px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-family:var(--font);font-size:12.5px;flex:0 0 auto}
.mem select{font-size:11px;border-radius:8px;border:1.5px solid var(--line);padding:2px;max-width:78px}
.mem .x{margin-left:auto;border:none;background:none;cursor:pointer;color:var(--no);font-weight:800}
.tinput{font-family:var(--font);font-weight:700;font-size:15px;padding:10px 13px;border-radius:14px;border:2px solid var(--line);background:#fff;color:var(--text);outline:none;min-width:0;width:100%}
.tinput:focus{border-color:var(--primary)}
.form-grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.form-grid label{display:flex;flex-direction:column;gap:4px;font-family:var(--font);font-weight:800;font-size:13px;color:var(--primary-dark)}
.note{font-size:12.5px;line-height:1.6;color:var(--muted);font-weight:700}
.warn-box{background:#FFF3E0;border:2px solid #FFB74D;color:#8A3B00;border-radius:14px;padding:10px 12px;font-size:13px;font-weight:700;line-height:1.6}
.ok-box{background:var(--ok-soft);border:2px solid var(--ok);color:#2E6B18;border-radius:14px;padding:10px 12px;font-size:13px;font-weight:700;line-height:1.6}
/* TOURNAMENT */
.statusbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;background:#fff;border:2px solid var(--line);border-radius:999px;padding:5px 12px;font-weight:800;font-size:12.5px;font-family:var(--font);color:var(--primary-dark)}
.chip.hot{background:var(--primary);color:#fff;border-color:var(--primary-dark)}
.banner{border-radius:20px;padding:14px 16px;font-family:var(--font);font-weight:800;font-size:18px;text-align:center;border:3px solid #fff;box-shadow:0 6px 0 var(--line);background:var(--soft);color:var(--primary-dark);animation:popIn .3s}
.banner.open{background:linear-gradient(135deg,#FF8A65,#E53935);color:#fff;box-shadow:0 6px 0 #8E1B1B}
.banner.answering{background:linear-gradient(135deg,var(--primary-2),var(--primary));color:#fff;box-shadow:0 6px 0 var(--primary-dark)}
.banner.good{background:var(--ok-soft);color:var(--ok);box-shadow:0 6px 0 var(--ok)}
.banner.bad{background:var(--no-soft);color:var(--no);box-shadow:0 6px 0 var(--no)}
.banner small{display:block;font-family:var(--body-font);font-size:13px;font-weight:700;margin-top:4px;opacity:.95}
.kring-btn{width:100%;min-height:150px;border-radius:34px;border:5px solid #fff;font-family:var(--font);font-weight:800;font-size:38px;letter-spacing:2px;color:#fff;cursor:pointer;background:linear-gradient(160deg,#FF7043,#D32F2F);box-shadow:0 12px 0 #8E1B1B,0 14px 30px rgba(0,0,0,.25);animation:kpulse 1.1s ease-in-out infinite;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;touch-action:manipulation}
.kring-btn:active{transform:translateY(8px);box-shadow:0 4px 0 #8E1B1B}
.kring-btn small{font-size:13px;letter-spacing:0;font-weight:700;opacity:.95}
.kring-btn:disabled{animation:none;background:linear-gradient(160deg,#CFD8DC,#90A4AE);box-shadow:0 8px 0 #607D8B;cursor:not-allowed;color:#455A64}
@keyframes kpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
.cd{font-family:var(--font);font-weight:800;font-size:56px;line-height:1;color:var(--primary);text-align:center}
.cd.low{color:var(--no)}
.cdbar{height:14px;border-radius:999px;background:var(--soft);overflow:hidden;border:2px solid #fff;margin-top:6px}
.cdbar i{display:block;height:100%;background:linear-gradient(90deg,var(--primary-2),var(--primary));transition:width .25s linear}
.qcard{background:var(--card);border:3px solid #fff;border-radius:var(--radius);box-shadow:0 8px 0 var(--line);padding:16px}
.qcard .q-text{font-size:16px}
.lvl-tag{display:inline-block;font-family:var(--font);font-weight:800;font-size:11.5px;background:var(--primary);color:#fff;border-radius:999px;padding:3px 11px}
.opt:disabled{opacity:.75;cursor:not-allowed}
.opt.sel{border-color:var(--primary);background:var(--soft)}
.ctl-grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.qlist{display:grid;gap:6px;max-height:260px;overflow:auto;padding:4px}
.qrow{display:flex;gap:8px;align-items:center;border:2px solid var(--line);background:#fff;border-radius:12px;padding:7px 10px;font-size:12.5px;font-weight:700;cursor:pointer;text-align:left}
.qrow.used{opacity:.5}
.qrow.sel{border-color:var(--primary);background:var(--soft)}
.demo-box{background:repeating-linear-gradient(45deg,#FFF8E1,#FFF8E1 10px,#FFF3C4 10px,#FFF3C4 20px);border:2px dashed #E0A800;border-radius:16px;padding:10px 12px}
.demo-box b{font-family:var(--font);color:#8A5A00}
.pytho-say{display:flex;gap:10px;align-items:center;background:var(--soft);border:3px solid var(--line);border-radius:20px;padding:10px 12px}
.pytho-say img{width:64px;height:64px;border-radius:50%;object-fit:cover;object-position:35% 22%;border:3px solid #fff;flex:0 0 auto;background:#fff}
.pytho-say p{font-size:13.5px;line-height:1.55;font-weight:700}
/* SKOR */
.podium{display:flex;align-items:flex-end;justify-content:center;gap:10px;min-height:190px;margin-top:8px}
.pod{flex:1;max-width:150px;text-align:center}
.pod .bar2{border-radius:14px 14px 0 0;display:flex;align-items:flex-start;justify-content:center;padding-top:8px;font-size:34px;border:3px solid #fff;box-shadow:0 5px 0 var(--line)}
.pod.p1 .bar2{height:130px;background:linear-gradient(180deg,#FFE082,#FFB300)}
.pod.p2 .bar2{height:96px;background:linear-gradient(180deg,#ECEFF1,#B0BEC5)}
.pod.p3 .bar2{height:70px;background:linear-gradient(180deg,#FFCCBC,#E08A5B)}
.pod .nm{font-family:var(--font);font-weight:800;font-size:14.5px;color:var(--primary-dark);margin-top:6px}
.pod .pt{font-size:12px;font-weight:800;color:var(--muted)}
.award-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.award{background:var(--soft);border:3px solid var(--line);border-radius:18px;padding:12px;text-align:center}
.award .e{font-size:30px}
.award b{font-family:var(--font);display:block;color:var(--primary-dark);font-size:14px}
.confetti{position:fixed;top:-20px;width:10px;height:14px;z-index:150;pointer-events:none;animation:confall 3.4s linear forwards;border-radius:2px}
@keyframes confall{to{transform:translateY(105vh) rotate(540deg);opacity:.9}}
/* LIKERT */
.lik{border:2px solid var(--line);border-radius:18px;padding:12px 14px;background:var(--card);margin-top:10px}
.lik-row{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.lik-btn{border:2.5px solid var(--line);background:#fff;border-radius:14px;padding:9px 2px;min-height:46px;font-family:var(--font);font-weight:800;font-size:17px;color:var(--text);cursor:pointer;box-shadow:0 3px 0 var(--line)}
.lik-btn.sel{background:var(--primary);color:#fff;border-color:var(--primary-dark)}
.lik-btn:disabled{opacity:.6;cursor:default}
.lik-scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;font-size:10.5px;font-weight:800;color:var(--muted);text-align:center;margin-top:4px;line-height:1.2}
.view{padding-bottom:110px}


/* ===== REVISI PYTHA: logo & maskot utuh, tanpa kotak/lingkaran ===== */
.brand-logo{width:auto;min-width:44px;max-width:170px;height:46px;border-radius:0;background:transparent;border:0;box-shadow:none;padding:0;overflow:visible}
.brand-logo img{width:auto;height:100%;max-width:100%;object-fit:contain;object-position:left center;display:block}
.sec-ico,.tab .tico,.pytho-say img{border-radius:0!important;border:0!important;box-shadow:none!important;background:transparent!important;object-fit:contain!important;object-position:center!important}
.pytho-say img{width:64px;height:64px;height:auto;max-height:76px}
.page-head .sec-ico{width:64px;height:auto;max-height:64px}
.hero-art .pytho-hero{width:auto;height:auto;max-width:100%;max-height:300px;border:0;border-radius:0;box-shadow:none;background:transparent;object-fit:contain}
.hero-art{width:190px}
.flow-step img{object-fit:contain;border-radius:0;background:transparent;border:0}
.tab{background:linear-gradient(180deg,var(--soft),var(--line))}
.tab.active{color:var(--primary-dark)}
.apers-svg{width:100%;max-width:300px;display:block;margin:6px auto}
.choice{display:block;width:100%;text-align:left;margin-top:8px;padding:10px 12px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--text);font-weight:700;font-size:13.5px;cursor:pointer}
.choice.sel{border-color:var(--gold-dark);background:var(--purple-soft)}
.rr-row{display:inline-flex;gap:6px;flex-wrap:wrap;vertical-align:middle}
.rr-chip{min-width:50px;padding:8px 10px;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--text);font-family:var(--font);font-weight:800;font-size:15px;cursor:pointer}
.rr-chip.sel{border-color:var(--gold-dark);background:var(--purple-soft)}.rr-chip.right{border-color:var(--ok);background:var(--ok-soft)}.rr-chip.wrong{border-color:var(--no);background:var(--no-soft)}
.choice.right{border-color:var(--ok);background:var(--ok-soft)}.choice.wrong{border-color:var(--no);background:var(--no-soft)}
.no-box{background:var(--no-soft);border:2px solid var(--no);color:#8E1B1B;border-radius:14px;padding:10px 12px;font-size:13px;font-weight:700;line-height:1.6}
.ap-steps{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px}
.ap-step{flex:1 1 0;min-width:96px;display:flex;align-items:center;gap:6px;justify-content:center;padding:8px 6px;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--muted);font-family:var(--font);font-weight:800;font-size:12.5px;cursor:pointer}
.ap-step span{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--primary-dark);font-size:12px;flex:none}
.ap-step.on{border-color:var(--primary);background:var(--soft);color:var(--primary-dark)}
.ap-step.on span{background:var(--primary);color:#fff}
.cp-box{max-height:240px;overflow:auto;font-size:13.5px;line-height:1.65;padding:6px 2px}
details.card summary{cursor:pointer;font-family:var(--font);font-weight:800;color:var(--primary-dark)}
.tp-list{margin:8px 0 0;padding-left:20px;line-height:1.65;font-size:14px}
.podium.big{min-height:230px;gap:14px}
.podium.big .pod .bar2{transform-origin:bottom;transform:scaleY(0);animation:podRise .8s cubic-bezier(.2,1.1,.4,1) forwards}
.podium.big .pod .nm,.podium.big .pod .pt{opacity:0;animation:podShow .5s forwards}
.podium.big .pod.p3 .bar2{animation-delay:.2s}.podium.big .pod.p3 .nm,.podium.big .pod.p3 .pt{animation-delay:.8s}
.podium.big .pod.p2 .bar2{animation-delay:.9s}.podium.big .pod.p2 .nm,.podium.big .pod.p2 .pt{animation-delay:1.5s}
.podium.big .pod.p1 .bar2{animation-delay:1.6s}.podium.big .pod.p1 .nm,.podium.big .pod.p1 .pt{animation-delay:2.2s}
.podium.big .pod.p1::before{content:'🏆';display:block;font-size:38px;opacity:0;animation:podShow .5s 2s forwards}
@keyframes podRise{to{transform:scaleY(1)}}@keyframes podShow{to{opacity:1}}
.award-mascot{max-height:150px;width:auto;object-fit:contain}

.obj-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.obj{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--text);font-weight:700;font-size:12px;cursor:pointer}
.obj svg{width:100%;max-width:64px;height:auto}
.obj.sel{border-color:var(--gold-dark);background:var(--purple-soft)}
.obj.ok{border-color:var(--ok);background:#E6F4EA}.obj.no{border-color:var(--no);background:#FDECEA}.obj.miss{border-style:dashed;border-color:var(--ok)}
.shape-row{display:flex;gap:8px;justify-content:space-between;margin-top:8px}.shape-row div{flex:1;text-align:center;font-size:11.5px;font-weight:700}.shape-row svg{width:100%;max-width:90px}
.tab.locked{opacity:.6}.tab.locked span::after{content:" 🔒";font-size:.85em}

/* ===== ARENA SATU PERANGKAT ===== */
.ar-bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.tow{border-radius:18px;padding:8px 10px;background:var(--card);border:2px solid var(--line)}
.tow svg{width:100%;height:auto;display:block}.tow .nm{display:flex;justify-content:space-between;font-weight:800;font-size:13px}
.knot{transition:cx .6s cubic-bezier(.3,1.4,.5,1)}
.bars .brow{display:flex;align-items:center;gap:8px;margin:4px 0;font-weight:800;font-size:13px}.bars .brow i{display:block;height:14px;border-radius:8px;transition:width .5s}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:10px;margin-top:10px}
.tile{aspect-ratio:1;border-radius:16px;border:0;background:linear-gradient(135deg,var(--primary-2),var(--primary));color:#fff;font:800 26px var(--font,inherit);cursor:pointer;box-shadow:0 4px 0 var(--primary-dark)}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 var(--primary-dark)}
.tile.done{background:var(--line);box-shadow:none;color:#9a8c75;text-decoration:line-through;cursor:default}
.ar-q .q-text{font-size:clamp(17px,2.3vw,26px);line-height:1.5}
.ar-teams{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-top:4px}
.ar-team{border-radius:16px;border:3px solid var(--tc);background:var(--card);padding:8px}
.ar-team h4{margin:0;padding:6px 8px;border-radius:10px;background:var(--tc);color:#fff;display:flex;justify-content:space-between;font-size:14px}
.ksqs{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px;margin-top:8px}
.ksq{aspect-ratio:1;border-radius:14px;border:3px solid var(--tc);background:#fff;color:var(--text);font-weight:800;font-size:11.5px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;padding:2px;word-break:break-word}
.ksq .b{font-size:26px;line-height:1}.ksq:active{transform:scale(.94)}.ksq:disabled{opacity:.4;cursor:not-allowed}
.ksq.win{background:var(--tc);color:#fff;opacity:1;animation:podShow .3s}.ksq.out{text-decoration:line-through}
.ar-ans{border:3px solid var(--tc,var(--primary));border-radius:16px;padding:12px;background:var(--card)}

.spin-ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9999;display:flex;align-items:center;justify-content:center;padding:10px}
.spin-box{background:var(--card);border-radius:20px;width:min(980px,100%);height:min(92vh,780px);display:flex;flex-direction:column;overflow:hidden}
.spin-box iframe{flex:1;border:0;width:100%;min-height:0}
.spin-bar{display:flex;gap:8px;align-items:center;padding:10px;flex-wrap:wrap;border-top:2px solid var(--line)}
.spin-bar span{flex:1 1 200px;font-weight:800}
.ksq small{font-weight:700;font-size:10px;opacity:.8}
.ksq.live{box-shadow:0 0 0 4px rgba(126,87,194,.28);animation:ksqPulse 1.1s ease-in-out infinite}
@keyframes ksqPulse{50%{transform:scale(1.06)}}
.cdot{width:28px;height:28px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line);cursor:pointer;padding:0}.cdot.sel{box-shadow:0 0 0 3px var(--text)}


.m3-q{margin-top:14px;padding-top:12px;border-top:2px dashed var(--line)}
.m3-q label{display:block;margin-top:10px;font-weight:800;font-size:13.5px;line-height:1.5}
.m3-eq{font:italic 700 28px/1.3 "Times New Roman",serif;text-align:center;margin:6px 0}
.m3-tbl{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px;text-align:center}.m3-tbl th,.m3-tbl td{border:1px solid var(--line);padding:4px 6px}.m3-tbl th{background:var(--soft)}
.m3-title{font-weight:800;color:var(--primary-dark);font-size:15px;margin-top:4px}
.m3-bar{height:14px;border-radius:8px;margin:3px 0;transition:width .3s}
</style>

  }

    let o = '';
    for(const ch of s){
      const c = code(ch);
      if(c === 40 || c === 41 || c === 92) o += '\\' + ch;
      else if(c > 126) o += '\\' + c.toString(8).padStart(3,'0');

    return '(' + o + ')';
  }

    const h = hex.replace('#','').trim();
    const n = parseInt(h.length === 3 ? h.split('').map(x=>x+x).join('') : h, 16);

  }

    constructor(){ this.W = 595.28; this.H = 841.89; this.M = 44; this.pages = []; this.newPage(); }
    newPage(){ this.ops = []; this.pages.push(this.ops); this.y = this.M; }
    ensure(h){ if(this.y + h > this.H - this.M - 14) { this.newPage(); return true; } return false; }
    rect(x, y, w, h, fill){ this.ops.push(`${rgb(fill)} rg ${x.toFixed(2)} ${(this.H - y - h).toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)} re f`); }
    line(x1, y1, x2, y2, color, lw){ this.ops.push(`${rgb(color)} RG ${lw||0.8} w ${x1} ${(this.H-y1).toFixed(2)} m ${x2} ${(this.H-y2).toFixed(2)} l S`); }
    text(x, y, s, size, bold, color){
      this.ops.push(`BT /${bold?'F2':'F1'} ${size} Tf ${rgb(color||'#222222')} rg ${x.toFixed(2)} ${(this.H - y).toFixed(2)} Td ${pdfStr(s)} Tj ET`);
    }
    wrap(s, size, maxW, bold){
      const words = clean(s).split(' '); const lines = []; let cur = '';

    para(s, opt){

      this.wrap(s, size, maxW, opt.bold).forEach(ln => {

      add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
      const kids = [];
      const total = this.pages.length;
      this.pages.forEach((ops, pi) => {
        const foot = `BT /F1 8 Tf 0.45 0.45 0.45 rg ${this.M} 24 Td ${pdfStr(this.footerText||'Pythagoras Team Challenge')} Tj ET BT /F1 8 Tf 0.45 0.45 0.45 rg ${this.W - this.M - 60} 24 Td ${pdfStr('Halaman ' + (pi+1) + ' / ' + total)} Tj ET`;
        const content = ops.join('\n') + '\n' + foot;
        const cId = add(`<< /Length ${content.length} >>\nstream\n${content}\nendstream`);
        const pId = add(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${this.W} ${this.H}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${cId} 0 R >>`);

      objs.forEach((o, i) => { offs.push(out.length); out += `${i+1} 0 obj\n${o}\nendobj\n`; });
      const xref = out.length;
      out += `xref\n0 ${objs.length+1}\n0000000000 65535 f \n` + offs.map(o => String(o).padStart(10,'0') + ' 00000 n \n').join('');
      out += `trailer\n<< /Size ${objs.length+1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;
      const bytes = new Uint8Array(out.length);
      for(let i = 0; i < out.length; i++) bytes[i] = out.charCodeAt(i) & 255;
      return bytes;
    }
  }

})();
