const REPORT_FORM_URL = "";                     // isi bila link pengumpulan laporan sudah ada
const SPIN_HTML = "<!DOCTYPE html>\n<html lang=\"id\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, maximum-scale=1.5\">\n    <title>Spin Nomor Pemain<\/title>\n    <style>:root{--pk-p:#2E7D4F;--pk-pd:#1F4D33;--pk-pl:#A8D5B5;--pk-soft:#E3F1E6;--pk-bg:#FAF6EC;--pk-hi:#C4AEEB;--pk-hid:#7E57C2;--pk-line:#D9CBB0;--pk-p-rgb:46,125,79;--pk-hi-rgb:196,174,235;--pk-bg-rgb:250,246,236}\n\n        /* ===== RESET & BASE ===== */\n        * {\n            box-sizing: border-box;\n            margin: 0;\n            padding: 0;\n        }\n\n        body {\n            font-family: 'Segoe UI', 'Comic Sans MS', 'Chalkboard SE', cursive, sans-serif;\n            background: var(--pk-bg);\n            min-height: 100vh;\n            padding: 16px;\n            display: flex;\n            justify-content: center;\n            align-items: flex-start;\n            background-image:\n                radial-gradient(circle at 5% 10%, rgba(255, 235, 59, 0.15) 0%, transparent 30%),\n                radial-gradient(circle at 95% 90%, rgba(var(--pk-p-rgb), 0.10) 0%, transparent 35%),\n                radial-gradient(circle at 20% 80%, rgba(var(--pk-hi-rgb), 0.08) 0%, transparent 25%);\n            background-attachment: fixed;\n        }\n\n        /* ===== DECORATIVE BACKGROUND ELEMENTS ===== */\n        body::before,\n        body::after {\n            content: '';\n            position: fixed;\n            border-radius: 50%;\n            pointer-events: none;\n            z-index: 0;\n            opacity: 0.12;\n        }\n        body::before {\n            width: 180px;\n            height: 180px;\n            background: radial-gradient(circle, var(--pk-line), transparent 70%);\n            top: 20px;\n            left: 20px;\n            animation: floatBg 12s ease-in-out infinite alternate;\n        }\n        body::after {\n            width: 140px;\n            height: 140px;\n            background: radial-gradient(circle, var(--pk-pl), transparent 70%);\n            bottom: 30px;\n            right: 30px;\n            animation: floatBg 15s ease-in-out infinite alternate-reverse;\n        }\n\n        @keyframes floatBg {\n            0% {\n                transform: translate(0, 0) scale(1);\n            }\n            100% {\n                transform: translate(30px, -20px) scale(1.2);\n            }\n        }\n\n        .deco-leaf {\n            position: fixed;\n            font-size: 36px;\n            pointer-events: none;\n            z-index: 0;\n            opacity: 0.15;\n            animation: swayLeaf 8s ease-in-out infinite alternate;\n        }\n        .deco-leaf:nth-of-type(1) {\n            top: 12%;\n            left: 5%;\n            animation-delay: 0s;\n        }\n        .deco-leaf:nth-of-type(2) {\n            bottom: 15%;\n            right: 4%;\n            animation-delay: 2s;\n            font-size: 28px;\n        }\n        .deco-leaf:nth-of-type(3) {\n            top: 50%;\n            left: 2%;\n            animation-delay: 4s;\n            font-size: 24px;\n        }\n        .deco-leaf:nth-of-type(4) {\n            bottom: 40%;\n            right: 2%;\n            animation-delay: 1s;\n            font-size: 32px;\n        }\n\n        @keyframes swayLeaf {\n            0% {\n                transform: rotate(-8deg) translateY(0);\n            }\n            100% {\n                transform: rotate(8deg) translateY(-12px);\n            }\n        }\n\n        .deco-cloud {\n            position: fixed;\n            font-size: 48px;\n            pointer-events: none;\n            z-index: 0;\n            opacity: 0.10;\n            animation: driftCloud 20s linear infinite;\n        }\n        .deco-cloud:nth-of-type(1) {\n            top: 5%;\n            left: -60px;\n            animation-duration: 25s;\n        }\n        .deco-cloud:nth-of-type(2) {\n            top: 18%;\n            left: -80px;\n            animation-duration: 30s;\n            animation-delay: 5s;\n            font-size: 36px;\n        }\n\n        @keyframes driftCloud {\n            0% {\n                transform: translateX(0);\n            }\n            100% {\n                transform: translateX(calc(100vw + 120px));\n            }\n        }\n\n        /* ===== MAIN CONTAINER ===== */\n        .app-container {\n            max-width: 1100px;\n            width: 100%;\n            background: rgba(var(--pk-bg-rgb), 0.75);\n            backdrop-filter: blur(4px);\n            border-radius: 48px 48px 32px 32px;\n            padding: 24px 28px 32px;\n            box-shadow: 0 16px 60px rgba(139, 69, 19, 0.12), 0 4px 20px rgba(0, 0, 0, 0.05);\n            border: 2px solid rgba(var(--pk-hi-rgb), 0.25);\n            position: relative;\n            z-index: 1;\n            transition: all 0.3s;\n        }\n\n        /* ===== HEADER ===== */\n        .header {\n            display: flex;\n            align-items: center;\n            justify-content: space-between;\n            flex-wrap: wrap;\n            gap: 12px 20px;\n            margin-bottom: 16px;\n            padding-bottom: 12px;\n            border-bottom: 3px dashed var(--pk-line);\n        }\n\n        .header-left {\n            display: flex;\n            align-items: center;\n            gap: 12px;\n            flex-wrap: wrap;\n        }\n\n        .header-icon {\n            font-size: 44px;\n            line-height: 1;\n            filter: drop-shadow(0 4px 8px rgba(var(--pk-hi-rgb), 0.3));\n            animation: wiggleDuck 3s ease-in-out infinite;\n        }\n        @keyframes wiggleDuck {\n            0%,\n            100% {\n                transform: rotate(-4deg) scale(1);\n            }\n            50% {\n                transform: rotate(4deg) scale(1.05);\n            }\n        }\n\n        .header-title {\n            font-size: 32px;\n            font-weight: 800;\n            color: var(--pk-hid);\n            letter-spacing: 1px;\n            text-shadow: 0 2px 8px rgba(var(--pk-hi-rgb), 0.2);\n        }\n        .header-title span {\n            color: var(--pk-pd);\n        }\n\n        .header-sub {\n            font-size: 18px;\n            color: #6D4C41;\n            font-weight: 500;\n            background: rgba(var(--pk-hi-rgb), 0.15);\n            padding: 4px 18px;\n            border-radius: 40px;\n            display: inline-block;\n            border: 1.5px solid rgba(var(--pk-hi-rgb), 0.25);\n        }\n\n        .header-right {\n            display: flex;\n            align-items: center;\n            gap: 10px;\n            flex-wrap: wrap;\n        }\n\n        .sound-toggle {\n            background: rgba(255, 255, 255, 0.6);\n            border: 2px solid var(--pk-pl);\n            border-radius: 40px;\n            padding: 6px 16px 6px 12px;\n            font-size: 18px;\n            font-weight: 600;\n            color: var(--pk-pd);\n            cursor: pointer;\n            display: flex;\n            align-items: center;\n            gap: 6px;\n            transition: all 0.2s;\n            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);\n        }\n        .sound-toggle:hover {\n            background: var(--pk-soft);\n            border-color: var(--pk-pl);\n            transform: scale(1.02);\n        }\n        .sound-toggle:active {\n            transform: scale(0.95);\n        }\n\n        /* ===== SETTINGS ===== */\n        .settings {\n            display: flex;\n            align-items: center;\n            flex-wrap: wrap;\n            gap: 12px 20px;\n            background: rgba(255, 255, 255, 0.5);\n            padding: 12px 20px;\n            border-radius: 40px;\n            margin-bottom: 18px;\n            border: 1.5px solid rgba(var(--pk-hi-rgb), 0.2);\n            backdrop-filter: blur(2px);\n        }\n\n        .settings label {\n            font-weight: 600;\n            color: #4E342E;\n            font-size: 17px;\n            display: flex;\n            align-items: center;\n            gap: 8px;\n        }\n\n        .settings input[type=\"number\"] {\n            width: 70px;\n            padding: 8px 10px;\n            border: 2px solid var(--pk-line);\n            border-radius: 30px;\n            font-size: 18px;\n            font-weight: 700;\n            text-align: center;\n            color: #4E342E;\n            background: white;\n            outline: none;\n            transition: border 0.2s, box-shadow 0.2s;\n        }\n        .settings input[type=\"number\"]:focus {\n            border-color: var(--pk-hi);\n            box-shadow: 0 0 0 4px rgba(var(--pk-hi-rgb), 0.2);\n        }\n        .settings input[type=\"number\"]::-webkit-inner-spin-button {\n            opacity: 1;\n        }\n\n        .btn-apply {\n            background: var(--pk-p);\n            border: none;\n            color: white;\n            font-weight: 700;\n            font-size: 16px;\n            padding: 8px 24px;\n            border-radius: 40px;\n            cursor: pointer;\n            transition: all 0.2s;\n            box-shadow: 0 4px 10px rgba(var(--pk-p-rgb), 0.25);\n            letter-spacing: 0.5px;\n        }\n        .btn-apply:hover {\n            background: var(--pk-pd);\n            transform: translateY(-2px);\n            box-shadow: 0 6px 16px rgba(var(--pk-p-rgb), 0.3);\n        }\n        .btn-apply:active {\n            transform: scale(0.95);\n        }\n\n        .stats-indicators {\n            display: flex;\n            align-items: center;\n            gap: 18px;\n            margin-left: auto;\n            flex-wrap: wrap;\n        }\n        .stat-item {\n            font-size: 15px;\n            font-weight: 600;\n            color: #4E342E;\n            background: rgba(255, 255, 255, 0.5);\n            padding: 4px 16px;\n            border-radius: 30px;\n            border: 1px solid rgba(var(--pk-hi-rgb), 0.15);\n        }\n        .stat-item span {\n            color: var(--pk-hid);\n            font-weight: 800;\n        }\n        .stat-item .num-green {\n            color: var(--pk-pd);\n        }\n\n        /* ===== TRACK AREA ===== */\n        .track-wrapper {\n            position: relative;\n            background: rgba(var(--pk-bg-rgb), 0.5);\n            border-radius: 32px;\n            padding: 48px 12px 24px;\n            margin: 6px 0 18px;\n            border: 2px solid rgba(var(--pk-hi-rgb), 0.12);\n            overflow: hidden;\n            min-height: 140px;\n            box-shadow: inset 0 2px 20px rgba(139, 69, 19, 0.04);\n        }\n\n        .track-wrapper::before {\n            content: '\ud83c\udf3f';\n            position: absolute;\n            left: 8px;\n            bottom: 8px;\n            font-size: 28px;\n            opacity: 0.25;\n            transform: rotate(-12deg);\n        }\n        .track-wrapper::after {\n            content: '\ud83c\udf3f';\n            position: absolute;\n            right: 8px;\n            bottom: 8px;\n            font-size: 28px;\n            opacity: 0.25;\n            transform: rotate(12deg) scaleX(-1);\n        }\n\n        .track-scroll {\n            overflow-x: auto;\n            overflow-y: visible;\n            padding: 8px 4px 20px;\n            scroll-behavior: smooth;\n            -webkit-overflow-scrolling: touch;\n            display: flex;\n            justify-content: center;\n            align-items: flex-start;\n            min-height: 90px;\n        }\n        .track-scroll::-webkit-scrollbar {\n            height: 6px;\n        }\n        .track-scroll::-webkit-scrollbar-track {\n            background: rgba(var(--pk-hi-rgb), 0.08);\n            border-radius: 10px;\n        }\n        .track-scroll::-webkit-scrollbar-thumb {\n            background: var(--pk-line);\n            border-radius: 10px;\n        }\n\n        .track {\n            display: flex;\n            flex-wrap: wrap;\n            justify-content: center;\n            align-items: center;\n            gap: 8px 6px;\n            padding: 8px 16px;\n            position: relative;\n            min-width: fit-content;\n            transition: all 0.2s;\n        }\n\n        /* ===== NUMBER ITEMS ===== */\n        .num-item {\n            display: flex;\n            align-items: center;\n            justify-content: center;\n            width: 52px;\n            height: 52px;\n            min-width: 44px;\n            min-height: 44px;\n            background: white;\n            border-radius: 16px;\n            font-size: 18px;\n            font-weight: 700;\n            color: #4E342E;\n            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06), 0 0 0 1.5px rgba(var(--pk-hi-rgb), 0.15);\n            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);\n            position: relative;\n            font-family: 'Segoe UI', monospace;\n            letter-spacing: 0.5px;\n            user-select: none;\n        }\n\n        .num-item.done {\n            background: var(--pk-soft);\n            border-color: var(--pk-pl);\n            opacity: 0.6;\n        }\n        .num-item.done::after {\n            content: '\u2713';\n            position: absolute;\n            top: -8px;\n            right: -8px;\n            font-size: 14px;\n            color: var(--pk-pd);\n            font-weight: 800;\n            background: white;\n            border-radius: 50%;\n            width: 22px;\n            height: 22px;\n            display: flex;\n            align-items: center;\n            justify-content: center;\n            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);\n            border: 1.5px solid var(--pk-pl);\n        }\n\n        .num-item.highlight {\n            background: var(--pk-line);\n            transform: scale(1.18);\n            box-shadow: 0 0 0 4px rgba(var(--pk-hi-rgb), 0.25), 0 8px 24px rgba(var(--pk-hi-rgb), 0.2);\n            border-color: var(--pk-hi);\n            z-index: 2;\n            color: #4E342E;\n        }\n\n        .num-item.selected {\n            background: var(--pk-hi);\n            transform: scale(1.35);\n            box-shadow: 0 0 0 6px rgba(var(--pk-hi-rgb), 0.3), 0 12px 32px rgba(var(--pk-hi-rgb), 0.25);\n            border-color: var(--pk-hid);\n            z-index: 5;\n            color: #3E2723;\n            font-size: 24px;\n            font-weight: 900;\n            animation: pulseSelected 1.2s ease-in-out infinite;\n        }\n        @keyframes pulseSelected {\n            0%,\n            100% {\n                box-shadow: 0 0 0 6px rgba(var(--pk-hi-rgb), 0.3), 0 12px 32px rgba(var(--pk-hi-rgb), 0.2);\n            }\n            50% {\n                box-shadow: 0 0 0 12px rgba(var(--pk-hi-rgb), 0.08), 0 12px 40px rgba(var(--pk-hi-rgb), 0.3);\n            }\n        }\n\n        .num-item.selected-glow {\n            animation: glowPulse 1s ease-in-out 3;\n        }\n        @keyframes glowPulse {\n            0%,\n            100% {\n                box-shadow: 0 0 0 6px rgba(var(--pk-hi-rgb), 0.3), 0 12px 32px rgba(var(--pk-hi-rgb), 0.2);\n            }\n            50% {\n                box-shadow: 0 0 0 18px rgba(var(--pk-hi-rgb), 0.05), 0 12px 48px rgba(var(--pk-hi-rgb), 0.4);\n            }\n        }\n\n        /* ===== DUCK ===== */\n        .duck-container {\n            position: absolute;\n            top: 0;\n            left: 0;\n            width: 100%;\n            height: 100%;\n            pointer-events: none;\n            z-index: 10;\n        }\n\n        .duck {\n            position: absolute;\n            top: 4px;\n            left: 0;\n            font-size: 44px;\n            line-height: 1;\n            transform: translateX(0);\n            transition: left 0.35s cubic-bezier(0.34, 1.2, 0.64, 1);\n            filter: drop-shadow(0 6px 16px rgba(var(--pk-hi-rgb), 0.25));\n            will-change: transform, left;\n            text-align: center;\n            width: 60px;\n            margin-left: -30px;\n            pointer-events: none;\n        }\n\n        .duck.walking {\n            animation: duckWalk 0.28s ease-in-out infinite;\n        }\n        .duck.bounce-stop {\n            animation: duckBounceStop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);\n        }\n\n        @keyframes duckWalk {\n            0%,\n            100% {\n                transform: translateY(0) rotate(-3deg) scale(1);\n            }\n            25% {\n                transform: translateY(-6px) rotate(2deg) scale(1.04);\n            }\n            75% {\n                transform: translateY(-2px) rotate(-1deg) scale(0.98);\n            }\n        }\n\n        @keyframes duckBounceStop {\n            0% {\n                transform: translateY(0) scale(1) rotate(0deg);\n            }\n            30% {\n                transform: translateY(-20px) scale(1.15) rotate(-6deg);\n            }\n            60% {\n                transform: translateY(-8px) scale(1.05) rotate(3deg);\n            }\n            100% {\n                transform: translateY(0) scale(1) rotate(0deg);\n            }\n        }\n\n        .duck .duck-emoji {\n            display: inline-block;\n            transition: transform 0.15s;\n        }\n\n        /* ===== BUTTONS ===== */\n        .action-area {\n            display: flex;\n            flex-direction: column;\n            align-items: center;\n            gap: 12px;\n            margin: 6px 0 16px;\n        }\n\n        .btn-start {\n            background: linear-gradient(145deg, var(--pk-p), var(--pk-pd));\n            border: none;\n            color: white;\n            font-size: 28px;\n            font-weight: 800;\n            padding: 16px 48px;\n            border-radius: 60px;\n            cursor: pointer;\n            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);\n            box-shadow: 0 8px 28px rgba(var(--pk-p-rgb), 0.3);\n            display: inline-flex;\n            align-items: center;\n            gap: 14px;\n            letter-spacing: 1px;\n            min-width: 200px;\n            justify-content: center;\n            border: 2px solid rgba(255, 255, 255, 0.15);\n        }\n        .btn-start:hover:not(:disabled) {\n            transform: translateY(-4px) scale(1.02);\n            box-shadow: 0 12px 36px rgba(var(--pk-p-rgb), 0.35);\n        }\n        .btn-start:active:not(:disabled) {\n            transform: scale(0.95);\n        }\n        .btn-start:disabled {\n            background: var(--pk-pl);\n            box-shadow: 0 4px 12px rgba(var(--pk-p-rgb), 0.15);\n            cursor: not-allowed;\n            transform: scale(0.98);\n            opacity: 0.7;\n        }\n        .btn-start.running {\n            background: var(--pk-hi);\n            box-shadow: 0 8px 28px rgba(var(--pk-hi-rgb), 0.3);\n        }\n\n        .btn-reset {\n            background: rgba(255, 255, 255, 0.6);\n            border: 2px solid var(--pk-line);\n            color: #6D4C41;\n            font-size: 16px;\n            font-weight: 600;\n            padding: 8px 24px;\n            border-radius: 40px;\n            cursor: pointer;\n            transition: all 0.2s;\n            display: inline-flex;\n            align-items: center;\n            gap: 8px;\n            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);\n        }\n        .btn-reset:hover {\n            background: var(--pk-soft);\n            border-color: var(--pk-line);\n            transform: translateY(-2px);\n        }\n        .btn-reset:active {\n            transform: scale(0.95);\n        }\n\n        .action-row {\n            display: flex;\n            align-items: center;\n            gap: 16px;\n            flex-wrap: wrap;\n            justify-content: center;\n        }\n\n        /* ===== RESULT CARD ===== */\n        .result-card {\n            background: white;\n            border-radius: 28px;\n            padding: 16px 28px 20px;\n            margin: 10px 0 16px;\n            text-align: center;\n            border: 2px solid var(--pk-line);\n            box-shadow: 0 6px 24px rgba(var(--pk-hi-rgb), 0.08);\n            transition: all 0.4s;\n            min-height: 80px;\n            display: flex;\n            flex-direction: column;\n            align-items: center;\n            justify-content: center;\n        }\n\n        .result-card .result-label {\n            font-size: 18px;\n            font-weight: 600;\n            color: #6D4C41;\n            letter-spacing: 1px;\n        }\n\n        .result-card .result-number {\n            font-size: 56px;\n            font-weight: 900;\n            color: var(--pk-hid);\n            line-height: 1.2;\n            animation: bounceResult 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);\n        }\n        @keyframes bounceResult {\n            0% {\n                transform: scale(0.3) rotate(-8deg);\n                opacity: 0;\n            }\n            50% {\n                transform: scale(1.3) rotate(3deg);\n                opacity: 1;\n            }\n            70% {\n                transform: scale(0.9) rotate(-2deg);\n            }\n            100% {\n                transform: scale(1) rotate(0deg);\n            }\n        }\n\n        .result-card .result-sub {\n            font-size: 18px;\n            color: #795548;\n            font-weight: 500;\n            margin-top: 2px;\n        }\n\n        .result-card .result-empty {\n            font-size: 18px;\n            color: #A1887F;\n            font-weight: 400;\n        }\n\n        .result-card .result-confetti {\n            position: relative;\n            overflow: hidden;\n        }\n\n        /* ===== CONFETTI ===== */\n        .confetti-container {\n            position: fixed;\n            top: 0;\n            left: 0;\n            width: 100%;\n            height: 100%;\n            pointer-events: none;\n            z-index: 999;\n            overflow: hidden;\n        }\n\n        .confetti-piece {\n            position: absolute;\n            width: 10px;\n            height: 10px;\n            border-radius: 2px;\n            animation: confettiFall linear forwards;\n            opacity: 0.85;\n        }\n        @keyframes confettiFall {\n            0% {\n                transform: translateY(-20px) rotate(0deg) scale(1);\n                opacity: 1;\n            }\n            100% {\n                transform: translateY(110vh) rotate(720deg) scale(0.3);\n                opacity: 0;\n            }\n        }\n\n        /* ===== HISTORY ===== */\n        .history-section {\n            margin-top: 18px;\n            border-top: 2px dashed rgba(var(--pk-hi-rgb), 0.2);\n            padding-top: 16px;\n        }\n\n        .history-header {\n            display: flex;\n            align-items: center;\n            justify-content: space-between;\n            flex-wrap: wrap;\n            gap: 10px;\n            margin-bottom: 10px;\n        }\n\n        .history-header h3 {\n            font-size: 20px;\n            color: #4E342E;\n            display: flex;\n            align-items: center;\n            gap: 8px;\n        }\n\n        .history-list {\n            display: flex;\n            flex-wrap: wrap;\n            gap: 6px 10px;\n            max-height: 110px;\n            overflow-y: auto;\n            padding: 6px 4px;\n            background: rgba(255, 255, 255, 0.3);\n            border-radius: 16px;\n            min-height: 40px;\n            align-items: center;\n        }\n        .history-list::-webkit-scrollbar {\n            width: 4px;\n        }\n        .history-list::-webkit-scrollbar-thumb {\n            background: var(--pk-line);\n            border-radius: 10px;\n        }\n\n        .history-item {\n            background: white;\n            padding: 4px 14px;\n            border-radius: 30px;\n            font-size: 14px;\n            font-weight: 600;\n            color: #4E342E;\n            border: 1.5px solid var(--pk-line);\n            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03);\n            animation: popIn 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);\n        }\n        .history-item .h-num {\n            color: var(--pk-hid);\n            font-weight: 800;\n        }\n        @keyframes popIn {\n            0% {\n                transform: scale(0.5);\n                opacity: 0;\n            }\n            100% {\n                transform: scale(1);\n                opacity: 1;\n            }\n        }\n\n        .history-empty {\n            color: #A1887F;\n            font-size: 15px;\n            padding: 6px 12px;\n        }\n\n        .btn-history-reset {\n            background: rgba(255, 255, 255, 0.5);\n            border: 1.5px solid var(--pk-line);\n            border-radius: 30px;\n            padding: 4px 18px;\n            font-size: 14px;\n            font-weight: 600;\n            color: #6D4C41;\n            cursor: pointer;\n            transition: all 0.2s;\n            display: flex;\n            align-items: center;\n            gap: 4px;\n        }\n        .btn-history-reset:hover {\n            background: var(--pk-soft);\n            border-color: var(--pk-line);\n        }\n\n        /* ===== FEATURE TOGGLES ===== */\n        .features {\n            display: flex;\n            align-items: center;\n            flex-wrap: wrap;\n            gap: 14px 24px;\n            margin: 8px 0 4px;\n            padding: 8px 4px;\n        }\n\n        .feature-toggle {\n            display: flex;\n            align-items: center;\n            gap: 8px;\n            font-size: 16px;\n            font-weight: 500;\n            color: #4E342E;\n            cursor: pointer;\n            user-select: none;\n        }\n        .feature-toggle input[type=\"checkbox\"] {\n            width: 20px;\n            height: 20px;\n            accent-color: var(--pk-p);\n            cursor: pointer;\n            border-radius: 6px;\n            border: 2px solid var(--pk-pl);\n            transition: all 0.2s;\n        }\n        .feature-toggle input[type=\"checkbox\"]:checked {\n            border-color: var(--pk-pd);\n        }\n\n        .btn-new-round {\n            background: var(--pk-hi);\n            border: none;\n            color: white;\n            font-weight: 700;\n            font-size: 15px;\n            padding: 6px 22px;\n            border-radius: 40px;\n            cursor: pointer;\n            transition: all 0.2s;\n            box-shadow: 0 4px 12px rgba(var(--pk-hi-rgb), 0.25);\n        }\n        .btn-new-round:hover {\n            background: var(--pk-hid);\n            transform: translateY(-2px);\n        }\n        .btn-new-round:active {\n            transform: scale(0.95);\n        }\n\n        /* ===== RESPONSIVE ===== */\n        @media (max-width: 768px) {\n            .app-container {\n                padding: 16px 14px 22px;\n                border-radius: 32px;\n            }\n\n            .header-title {\n                font-size: 26px;\n            }\n            .header-icon {\n                font-size: 34px;\n            }\n            .header-sub {\n                font-size: 15px;\n                padding: 2px 14px;\n            }\n\n            .settings {\n                padding: 10px 16px;\n                border-radius: 30px;\n                flex-direction: column;\n                align-items: stretch;\n                gap: 10px;\n            }\n            .settings label {\n                font-size: 15px;\n            }\n            .stats-indicators {\n                margin-left: 0;\n                justify-content: center;\n            }\n\n            .track-wrapper {\n                padding: 40px 6px 18px;\n                min-height: 120px;\n            }\n\n            .num-item {\n                width: 44px;\n                height: 44px;\n                min-width: 38px;\n                min-height: 38px;\n                font-size: 15px;\n                border-radius: 12px;\n            }\n            .num-item.selected {\n                font-size: 20px;\n                transform: scale(1.25);\n            }\n            .num-item.highlight {\n                transform: scale(1.1);\n            }\n\n            .duck {\n                font-size: 36px;\n                width: 48px;\n                margin-left: -24px;\n            }\n\n            .btn-start {\n                font-size: 22px;\n                padding: 14px 32px;\n                min-width: 160px;\n            }\n\n            .result-card .result-number {\n                font-size: 42px;\n            }\n\n            .features {\n                gap: 10px 16px;\n                font-size: 14px;\n            }\n\n            .header-right .sound-toggle {\n                font-size: 15px;\n                padding: 4px 12px 4px 10px;\n            }\n        }\n\n        @media (max-width: 480px) {\n            .app-container {\n                padding: 12px 10px 18px;\n                border-radius: 24px;\n            }\n\n            .header-title {\n                font-size: 20px;\n            }\n            .header-icon {\n                font-size: 28px;\n            }\n            .header-sub {\n                font-size: 13px;\n                padding: 2px 10px;\n            }\n\n            .settings input[type=\"number\"] {\n                width: 60px;\n                font-size: 16px;\n                padding: 6px 8px;\n            }\n            .btn-apply {\n                font-size: 14px;\n                padding: 6px 18px;\n            }\n\n            .num-item {\n                width: 38px;\n                height: 38px;\n                min-width: 34px;\n                min-height: 34px;\n                font-size: 13px;\n                border-radius: 10px;\n            }\n            .num-item.selected {\n                font-size: 17px;\n                transform: scale(1.2);\n            }\n\n            .duck {\n                font-size: 30px;\n                width: 40px;\n                margin-left: -20px;\n            }\n\n            .btn-start {\n                font-size: 18px;\n                padding: 12px 24px;\n                min-width: 140px;\n                gap: 8px;\n            }\n\n            .track-wrapper {\n                padding: 34px 4px 14px;\n                min-height: 100px;\n            }\n\n            .result-card .result-number {\n                font-size: 34px;\n            }\n            .result-card .result-sub {\n                font-size: 15px;\n            }\n\n            .stat-item {\n                font-size: 13px;\n                padding: 2px 12px;\n            }\n            .features {\n                font-size: 13px;\n                gap: 6px 12px;\n            }\n            .feature-toggle input[type=\"checkbox\"] {\n                width: 18px;\n                height: 18px;\n            }\n\n            .history-item {\n                font-size: 12px;\n                padding: 3px 10px;\n            }\n        }\n\n        @media (max-width: 380px) {\n            .num-item {\n                width: 32px;\n                height: 32px;\n                min-width: 30px;\n                min-height: 30px;\n                font-size: 11px;\n                border-radius: 8px;\n            }\n            .duck {\n                font-size: 26px;\n                width: 34px;\n                margin-left: -17px;\n            }\n            .btn-start {\n                font-size: 16px;\n                padding: 10px 18px;\n                min-width: 120px;\n            }\n            .header-title {\n                font-size: 17px;\n            }\n            .result-card .result-number {\n                font-size: 28px;\n            }\n        }\n\n        /* ===== UTILITY ===== */\n        .hidden {\n            display: none !important;\n        }\n        .text-center {\n            text-align: center;\n        }\n\n        .mt-8 {\n            margin-top: 8px;\n        }\n        .mb-8 {\n            margin-bottom: 8px;\n        }\n\n        .all-done-msg {\n            background: var(--pk-soft);\n            border-radius: 20px;\n            padding: 12px 24px;\n            font-size: 20px;\n            font-weight: 700;\n            color: var(--pk-pd);\n            border: 2px solid var(--pk-pl);\n            display: inline-flex;\n            align-items: center;\n            gap: 12px;\n            animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);\n        }\n\n        /* ===== NO STUDENTS MESSAGE ===== */\n        .no-students-msg {\n            text-align: center;\n            padding: 24px;\n            color: #8D6E63;\n            font-size: 18px;\n            font-weight: 500;\n        }\n\n        /* scrollable track on mobile */\n        @media (max-width: 600px) {\n            .track-scroll {\n                justify-content: flex-start;\n            }\n            .track {\n                flex-wrap: nowrap;\n                padding: 4px 8px;\n                justify-content: flex-start;\n                min-width: 100%;\n            }\n            .num-item {\n                flex-shrink: 0;\n            }\n        }\n\n        /* Fix for very wide screens */\n        @media (min-width: 1200px) {\n            .num-item {\n                width: 60px;\n                height: 60px;\n                font-size: 20px;\n                border-radius: 18px;\n            }\n            .duck {\n                font-size: 52px;\n            }\n            .track-wrapper {\n                padding: 56px 16px 28px;\n            }\n        }\n    \n.deco-leaf,.deco-cloud,body::before,body::after{display:none!important}.settings,.features,.history-section{display:none!important}body{padding:8px;background-image:none}.app-container{border-radius:24px;padding:14px 16px 18px}\n.track-wrapper::before,.track-wrapper::after{display:none!important}\n<\/style>\n<\/head>\n<body>\n\n    <!-- ===== DECORATIVE ELEMENTS ===== -->\n    <div class=\"deco-leaf\" style=\"top:8%;left:3%;\">\ud83c\udf3f<\/div>\n    <div class=\"deco-leaf\" style=\"bottom:12%;right:2%;\">\ud83c\udf31<\/div>\n    <div class=\"deco-leaf\" style=\"top:45%;left:1%;\">\ud83c\udf43<\/div>\n    <div class=\"deco-leaf\" style=\"bottom:35%;right:1%;\">\ud83c\udf3f<\/div>\n    <div class=\"deco-cloud\">\u2601\ufe0f<\/div>\n    <div class=\"deco-cloud\" style=\"top:20%;\">\u2601\ufe0f<\/div>\n\n    <!-- ===== CONFETTI CONTAINER ===== -->\n    <div class=\"confetti-container\" id=\"confettiContainer\"><\/div>\n\n    <!-- ===== APP ===== -->\n    <div class=\"app-container\" id=\"app\">\n\n        <!-- HEADER -->\n        <header class=\"header\">\n            <div class=\"header-left\">\n                <span class=\"header-icon\">\ud83e\udd86<\/span>\n                <div>\n                    <div class=\"header-title\">SPIN <span>NOMOR PEMAIN<\/span><\/div>\n                    <div class=\"header-sub\">Siapa yang berkesempatan menjawab?<\/div>\n                <\/div>\n            <\/div>\n            <div class=\"header-right\">\n                <button class=\"sound-toggle\" id=\"soundToggle\" title=\"Sound ON/OFF\">\n                    <span id=\"soundIcon\">\ud83d\udd0a<\/span> <span id=\"soundLabel\">ON<\/span>\n                <\/button>\n            <\/div>\n        <\/header>\n\n        <!-- SETTINGS -->\n        <div class=\"settings\">\n            <label>\n                \ud83d\udcda Jumlah Siswa\n                <input type=\"number\" id=\"studentCount\" value=\"30\" min=\"2\" max=\"50\">\n            <\/label>\n            <button class=\"btn-apply\" id=\"applyBtn\">TERAPKAN<\/button>\n\n            <div class=\"stats-indicators\">\n                <div class=\"stat-item\">\ud83c\udfaf Tersedia: <span id=\"availableCount\">30<\/span><\/div>\n                <div class=\"stat-item\">\u2705 Terpilih: <span class=\"num-green\" id=\"selectedCount\">0<\/span><\/div>\n            <\/div>\n        <\/div>\n\n        <!-- FEATURES -->\n        <div class=\"features\">\n            <label class=\"feature-toggle\">\n                <input type=\"checkbox\" id=\"noRepeatCheck\">\n                \u2611 Jangan pilih siswa yang sudah terpilih\n            <\/label>\n            <button class=\"btn-new-round hidden\" id=\"newRoundBtn\">\ud83d\udd04 MULAI PUTARAN BARU<\/button>\n            <button class=\"btn-reset\" id=\"resetBtn\">\ud83d\udd04 Reset<\/button>\n        <\/div>\n\n        <!-- TRACK -->\n        <div class=\"track-wrapper\" id=\"trackWrapper\">\n            <div class=\"duck-container\" id=\"duckContainer\">\n                <div class=\"duck\" id=\"duck\">\n                    <span class=\"duck-emoji\">\ud83e\udd86<\/span>\n                <\/div>\n            <\/div>\n            <div class=\"track-scroll\" id=\"trackScroll\">\n                <div class=\"track\" id=\"track\">\n                    <!-- numbers rendered by JS -->\n                <\/div>\n            <\/div>\n        <\/div>\n\n        <!-- ACTION -->\n        <div class=\"action-area\">\n            <button class=\"btn-start\" id=\"startBtn\">\ud83e\udd86 MULAI SPIN!<\/button>\n            <div id=\"allDoneMessage\" class=\"hidden all-done-msg\">\n                \ud83c\udf89 Semua siswa sudah mendapatkan giliran!\n            <\/div>\n        <\/div>\n\n        <!-- RESULT -->\n        <div class=\"result-card\" id=\"resultCard\">\n            <div class=\"result-label\">NOMOR PEMAIN TERPILIH<\/div>\n            <div class=\"result-empty\" id=\"resultEmpty\">Tekan MULAI SPIN untuk memilih nomor.<\/div>\n            <div class=\"hidden\" id=\"resultContent\">\n                <div class=\"result-number\" id=\"resultNumber\">\u2014<\/div>\n                <div class=\"result-sub\" id=\"resultSub\">Bersiap untuk menjawab! \ud83e\udd86<\/div>\n            <\/div>\n        <\/div>\n\n        <!-- HISTORY -->\n        <div class=\"history-section\">\n            <div class=\"history-header\">\n                <h3>\ud83d\udccb RIWAYAT PEMILIHAN<\/h3>\n                <button class=\"btn-history-reset\" id=\"historyResetBtn\">\ud83d\uddd1 RESET RIWAYAT<\/button>\n            <\/div>\n            <div class=\"history-list\" id=\"historyList\">\n                <span class=\"history-empty\">Belum ada riwayat.<\/span>\n            <\/div>\n        <\/div>\n\n    <\/div>\n\n    <script>\n        // ============================================================\n        //  DUCK PICKER \u2014 Full Application Logic\n        // ============================================================\n\n        (function() {\n            'use strict';\n\n            // ===== STATE =====\n            let students = []; // { number, selected }\n            let history = []; // array of student numbers (strings)\n            let isRunning = false;\n            let isSoundOn = true;\n            let noRepeatMode = false;\n\n            let currentStep = 0;\n            let totalSteps = 0;\n            let targetIndex = -1;\n            let currentHighlightIndex = -1;\n            let animationTimer = null;\n            let animationFrame = null;\n            let isAllDone = false;\n\n            // ===== DOM REFS =====\n            const track = document.getElementById('track');\n            const trackScroll = document.getElementById('trackScroll');\n            const duck = document.getElementById('duck');\n            const duckContainer = document.getElementById('duckContainer');\n            const startBtn = document.getElementById('startBtn');\n            const applyBtn = document.getElementById('applyBtn');\n            const resetBtn = document.getElementById('resetBtn');\n            const studentCountInput = document.getElementById('studentCount');\n            const availableCount = document.getElementById('availableCount');\n            const selectedCount = document.getElementById('selectedCount');\n            const resultEmpty = document.getElementById('resultEmpty');\n            const resultContent = document.getElementById('resultContent');\n            const resultNumber = document.getElementById('resultNumber');\n            const resultSub = document.getElementById('resultSub');\n            const resultCard = document.getElementById('resultCard');\n            const historyList = document.getElementById('historyList');\n            const historyResetBtn = document.getElementById('historyResetBtn');\n            const noRepeatCheck = document.getElementById('noRepeatCheck');\n            const newRoundBtn = document.getElementById('newRoundBtn');\n            const allDoneMessage = document.getElementById('allDoneMessage');\n            const soundToggle = document.getElementById('soundToggle');\n            const soundIcon = document.getElementById('soundIcon');\n            const soundLabel = document.getElementById('soundLabel');\n            const confettiContainer = document.getElementById('confettiContainer');\n\n            // ===== AUDIO =====\n            let audioCtx = null;\n            let masterGain = null;\n\n            function initAudio() {\n                if (!audioCtx) {\n                    try {\n                        audioCtx = new(window.AudioContext || window.webkitAudioContext)();\n                        masterGain = audioCtx.createGain();\n                        masterGain.gain.value = 0.5;\n                        masterGain.connect(audioCtx.destination);\n                    } catch (_) { /* ignore */ }\n                }\n                if (audioCtx && audioCtx.state === 'suspended') {\n                    audioCtx.resume().catch(() => {});\n                }\n                return audioCtx;\n            }\n\n            function playTone(freq, duration, type, volume, delay) {\n                if (!isSoundOn) return;\n                try {\n                    const ctx = initAudio();\n                    if (!ctx) return;\n                    const osc = ctx.createOscillator();\n                    const gain = ctx.createGain();\n                    osc.type = type || 'sine';\n                    osc.frequency.value = freq || 800;\n                    gain.gain.value = (volume || 0.08);\n                    osc.connect(gain);\n                    gain.connect(masterGain || ctx.destination);\n                    const startTime = ctx.currentTime + (delay || 0);\n                    osc.start(startTime);\n                    osc.stop(startTime + (duration || 0.06));\n                } catch (_) { /* ignore */ }\n            }\n\n            function playPop() { playTone(880, 0.05, 'sine', 0.10); }\n\n            function playTap() { playTone(1200 + Math.random() * 400, 0.025, 'sine', 0.06); }\n\n            function playBoing() {\n                playTone(600, 0.10, 'sine', 0.12);\n                setTimeout(() => playTone(900, 0.08, 'sine', 0.10), 80);\n            }\n\n            function playTada() {\n                const notes = [523, 659, 784, 1047];\n                notes.forEach((f, i) => {\n                    setTimeout(() => playTone(f, 0.12, 'sine', 0.09), i * 100);\n                });\n            }\n\n            function playClick() { playTone(1000, 0.03, 'square', 0.04); }\n\n            // ===== SOUND TOGGLE =====\n            soundToggle.addEventListener('click', function(e) {\n                e.stopPropagation();\n                isSoundOn = !isSoundOn;\n                soundIcon.textContent = isSoundOn ? '\ud83d\udd0a' : '\ud83d\udd07';\n                soundLabel.textContent = isSoundOn ? 'ON' : 'OFF';\n                if (isSoundOn) {\n                    initAudio();\n                    playClick();\n                }\n            });\n\n            // ===== RENDER =====\n            function renderTrack() {\n                track.innerHTML = '';\n                students.forEach((s, idx) => {\n                    const div = document.createElement('div');\n                    div.className = 'num-item';\n                    if (s.selected) div.classList.add('done');\n                    div.dataset.index = idx;\n                    div.textContent = String(s.number).padStart(2, '0');\n                    track.appendChild(div);\n                });\n                updateStats();\n                updateAllDoneState();\n            }\n\n            function updateStats() {\n                const total = students.length;\n                const sel = students.filter(s => s.selected).length;\n                availableCount.textContent = total - sel;\n                selectedCount.textContent = sel;\n            }\n\n            function updateAllDoneState() {\n                const total = students.length;\n                if (total === 0) {\n                    allDoneMessage.classList.add('hidden');\n                    isAllDone = false;\n                    return;\n                }\n                const available = students.filter(s => !s.selected).length;\n                const allDone = (available === 0 && total > 0);\n                isAllDone = allDone;\n                if (allDone && noRepeatMode) {\n                    allDoneMessage.classList.remove('hidden');\n                    newRoundBtn.classList.remove('hidden');\n                } else {\n                    allDoneMessage.classList.add('hidden');\n                    newRoundBtn.classList.add('hidden');\n                }\n                // update start button text if all done\n                if (allDone && noRepeatMode) {\n                    startBtn.disabled = true;\n                    startBtn.innerHTML = '\ud83c\udf89 SEMUA TERPILIH';\n                } else {\n                    if (!isRunning) {\n                        startBtn.disabled = false;\n                        startBtn.innerHTML = '\ud83e\udd86 MULAI SPIN!';\n                    }\n                }\n            }\n\n            function renderHistory() {\n                historyList.innerHTML = '';\n                if (history.length === 0) {\n                    const empty = document.createElement('span');\n                    empty.className = 'history-empty';\n                    empty.textContent = 'Belum ada riwayat.';\n                    historyList.appendChild(empty);\n                    return;\n                }\n                // show newest first\n                const reversed = [...history].reverse();\n                reversed.forEach((num, idx) => {\n                    const item = document.createElement('span');\n                    item.className = 'history-item';\n                    item.innerHTML = `Pemilihan ${history.length - idx} \u2192 <span class=\"h-num\">${num}<\/span>`;\n                    historyList.appendChild(item);\n                });\n            }\n\n            function updateResult(number) {\n                resultEmpty.classList.add('hidden');\n                resultContent.classList.remove('hidden');\n                resultNumber.textContent = String(number).padStart(2, '0');\n                resultNumber.style.animation = 'none';\n                void resultNumber.offsetWidth;\n                resultNumber.style.animation = 'bounceResult 0.8s cubic-bezier(0.34, 1.56, 0.64, 1)';\n                resultSub.textContent = 'Pemain bernomor ini bersiap menjawab!';\n                // add glow to the card\n                resultCard.style.borderColor = 'var(--pk-hi)';\n                resultCard.style.boxShadow = '0 8px 32px rgba(var(--pk-hi-rgb), 0.35)';\n            }\n\n            function resetResult() {\n                resultEmpty.classList.remove('hidden');\n                resultContent.classList.add('hidden');\n                resultCard.style.borderColor = 'var(--pk-line)';\n                resultCard.style.boxShadow = 'none';\n            }\n\n            // ===== CLEAR HIGHLIGHTS =====\n            function clearHighlights() {\n                document.querySelectorAll('.num-item.highlight, .num-item.selected, .num-item.selected-glow')\n                    .forEach(el => {\n                        el.classList.remove('highlight', 'selected', 'selected-glow');\n                    });\n                duck.classList.remove('walking', 'bounce-stop');\n                duck.style.left = '0px';\n            }\n\n            // ===== DUCK POSITION =====\n            function positionDuckAtIndex(index) {\n                const items = track.querySelectorAll('.num-item');\n                if (!items.length || index < 0 || index >= items.length) {\n                    duck.style.left = '0px';\n                    return;\n                }\n                const el = items[index];\n                const rect = el.getBoundingClientRect();\n                const containerRect = duck.parentElement.getBoundingClientRect();\n                duck.style.left = (rect.left - containerRect.left + rect.width / 2) + 'px';\n                duck.style.top = Math.max(4, rect.top - containerRect.top - 46) + 'px';\n\n                // scroll into view if needed\n                if (trackScroll) {\n                    const scrollRect = trackScroll.getBoundingClientRect();\n                    if (rect.left < scrollRect.left + 20 || rect.right > scrollRect.right - 20) {\n                        el.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });\n                    }\n                }\n            }\n\n            // ===== ANIMATION LOOP =====\n            function runSelection() {\n                if (isRunning) return;\n                const total = students.length;\n                if (total === 0) {\n                    return;\n                }\n\n                // check all done\n                if (noRepeatMode) {\n                    const available = students.filter(s => !s.selected).length;\n                    if (available === 0) {\n                        return;\n                    }\n                }\n\n                // pick target\n                let candidates = students.map((s, i) => i);\n                if (noRepeatMode) {\n                    candidates = students.map((s, i) => s.selected ? -1 : i).filter(i => i >= 0);\n                    if (candidates.length === 0) {\n                        return;\n                    }\n                }\n                const randomIdx = Math.floor(Math.random() * candidates.length);\n                targetIndex = candidates[randomIdx];\n\n                // Determine total steps (20-40)\n                totalSteps = 20 + Math.floor(Math.random() * 20);\n                currentStep = 0;\n\n                // find starting index - current highlight or 0\n                let startIdx = 0;\n                const highlighted = document.querySelector('.num-item.highlight');\n                if (highlighted) {\n                    const idx = parseInt(highlighted.dataset.index);\n                    if (!isNaN(idx)) startIdx = idx;\n                }\n                // ensure we don't start at target if steps are too few\n                // but we'll just let it run\n\n                isRunning = true;\n                startBtn.disabled = true;\n                startBtn.innerHTML = '\u23f3 MEMILIH\u2026';\n                startBtn.classList.add('running');\n\n                // clear previous selection state\n                document.querySelectorAll('.num-item.selected, .num-item.selected-glow').forEach(el => {\n                    el.classList.remove('selected', 'selected-glow');\n                });\n                duck.classList.remove('bounce-stop');\n\n                // hide result\n                resetResult();\n\n                // initial tap sound\n                playPop();\n\n                // start the step loop\n                let stepCount = 0;\n                let lastHighlight = -1;\n\n                function doStep() {\n                    if (!isRunning) return;\n\n                    const progress = stepCount / totalSteps;\n                    // delay increases: fast -> slow\n                    const minDelay = 50;\n                    const maxDelay = 420;\n                    const delay = minDelay + (maxDelay - minDelay) * Math.pow(progress, 2);\n                    // add tiny randomness\n                    const jitter = 1 + (Math.random() - 0.5) * 0.15;\n                    const actualDelay = Math.min(delay * jitter, maxDelay + 50);\n\n                    // determine which index to highlight\n                    let idx;\n                    if (stepCount < totalSteps) {\n                        // move forward, wrap around\n                        const prev = (lastHighlight >= 0) ? lastHighlight : 0;\n                        idx = (prev + 1) % total;\n                        // make sure we don't skip target too early\n                        // we want to pass through target near the end\n                        // but still show some movement\n                    } else {\n                        idx = targetIndex;\n                    }\n\n                    // update highlight\n                    const items = track.querySelectorAll('.num-item');\n                    items.forEach((el, i) => {\n                        el.classList.remove('highlight');\n                        if (i === idx) {\n                            el.classList.add('highlight');\n                        }\n                    });\n\n                    // move duck\n                    positionDuckAtIndex(idx);\n                    duck.classList.add('walking');\n\n                    // play tap sound (not every step)\n                    if (stepCount % 2 === 0 || stepCount === totalSteps - 1) {\n                        playTap();\n                    }\n\n                    lastHighlight = idx;\n                    stepCount++;\n\n                    // check if done\n                    if (stepCount > totalSteps) {\n                        // final step: land on target\n                        finishSelection();\n                        return;\n                    }\n\n                    // schedule next step\n                    animationTimer = setTimeout(doStep, actualDelay);\n                }\n\n                function finishSelection() {\n                    // ensure we are at target\n                    const items = track.querySelectorAll('.num-item');\n                    items.forEach((el, i) => {\n                        el.classList.remove('highlight');\n                        if (i === targetIndex) {\n                            el.classList.add('selected', 'selected-glow');\n                            // mark as done if no-repeat mode\n                            if (noRepeatMode) {\n                                students[i].selected = true;\n                                el.classList.add('done');\n                            }\n                        }\n                    });\n\n                    // update duck position\n                    positionDuckAtIndex(targetIndex);\n                    duck.classList.remove('walking');\n                    duck.classList.add('bounce-stop');\n\n                    // play boing + tada\n                    playBoing();\n                    setTimeout(() => {\n                        playTada();\n                        // confetti!\n                        launchConfetti();\n                    }, 300);\n\n                    // update result\n                    const selectedNumber = students[targetIndex].number;\n                    updateResult(selectedNumber);\n                    try{ parent.postMessage({ type:'duck-result', number:selectedNumber }, '*'); }catch(e){}\n\n                    // add to history\n                    const numStr = String(selectedNumber).padStart(2, '0');\n                    history.push(numStr);\n                    renderHistory();\n\n                    // update stats\n                    updateStats();\n\n                    // all done check\n                    updateAllDoneState();\n\n                    // enable button\n                    isRunning = false;\n                    startBtn.classList.remove('running');\n                    if (!isAllDone || !noRepeatMode) {\n                        startBtn.disabled = false;\n                        startBtn.innerHTML = '\ud83e\udd86 PILIH LAGI';\n                    } else {\n                        startBtn.disabled = true;\n                        startBtn.innerHTML = '\ud83c\udf89 SEMUA TERPILIH';\n                    }\n\n                    // scroll to selected\n                    const selectedEl = items[targetIndex];\n                    if (selectedEl) {\n                        selectedEl.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });\n                    }\n                }\n\n                // start the animation\n                // small delay before starting for suspense\n                setTimeout(() => {\n                    // clear any old timer\n                    if (animationTimer) {\n                        clearTimeout(animationTimer);\n                        animationTimer = null;\n                    }\n                    // start with first step\n                    stepCount = 0;\n                    lastHighlight = -1;\n                    doStep();\n                }, 400);\n\n                // Update all done state after selection completes\n                // it will be updated in finishSelection\n            }\n\n            // ===== CONFETTI =====\n            function launchConfetti() {\n                const container = confettiContainer;\n                const colors = ['#FFD700', '#FFEB3B', '#4CAF50', '#66BB6A', '#FFFFFF', '#FFA726', '#FF8A65'];\n                const count = 80 + Math.floor(Math.random() * 40);\n\n                for (let i = 0; i < count; i++) {\n                    const piece = document.createElement('div');\n                    piece.className = 'confetti-piece';\n                    const size = 6 + Math.random() * 10;\n                    const color = colors[Math.floor(Math.random() * colors.length)];\n                    const left = Math.random() * 100;\n                    const duration = 2 + Math.random() * 2;\n                    const delay = Math.random() * 1.2;\n                    const rotate = Math.random() * 720;\n                    const shape = Math.random() > 0.5 ? '50%' : '2px';\n                    piece.style.cssText = `\n                            left: ${left}%;\n                            width: ${size}px;\n                            height: ${size * (0.6 + Math.random() * 0.8)}px;\n                            background: ${color};\n                            border-radius: ${shape};\n                            animation-duration: ${duration}s;\n                            animation-delay: ${delay}s;\n                            transform: rotate(${rotate}deg);\n                        `;\n                    container.appendChild(piece);\n\n                    // remove after animation\n                    setTimeout(() => {\n                        if (piece.parentNode) piece.remove();\n                    }, (duration + delay) * 1000 + 100);\n                }\n\n                // cleanup after a while\n                setTimeout(() => {\n                    container.innerHTML = '';\n                }, 5000);\n            }\n\n            // ===== APPLY STUDENTS =====\n            function applyStudents() {\n                if (isRunning) return;\n\n                let count = parseInt(studentCountInput.value);\n                if (isNaN(count) || count < 2) count = 2;\n                if (count > 50) count = 50;\n                studentCountInput.value = count;\n\n                // preserve selected status if we are reducing?\n                // We'll reset all state\n                const newStudents = [];\n                for (let i = 1; i <= count; i++) {\n                    // if existing student with same number and selected, keep selected?\n                    // but we'll just reset for simplicity\n                    const existing = students.find(s => s.number === i);\n                    newStudents.push({\n                        number: i,\n                        selected: existing ? existing.selected : false\n                    });\n                }\n\n                // if no-repeat mode, we need to keep selected status\n                // but if count changed, we reset\n                students = newStudents;\n\n                // if count changed, reset selected status for safety\n                // actually, if we want to preserve, we already did above\n                // but we also need to handle case where count decreased\n                // any student number > count will be removed\n                // any selected status for removed students is lost\n\n                // also if count changed, we should reset history?\n                // we'll keep history but filter out numbers > count\n                history = history.filter(num => parseInt(num) <= count);\n\n                // clear selection highlights\n                clearHighlights();\n                resetResult();\n\n                // reset all done state\n                isAllDone = false;\n\n                renderTrack();\n                renderHistory();\n                updateStats();\n                updateAllDoneState();\n\n                // reset duck position\n                duck.style.left = '0px';\n                duck.classList.remove('walking', 'bounce-stop');\n\n                // enable start\n                if (!isRunning) {\n                    startBtn.disabled = false;\n                    startBtn.innerHTML = '\ud83e\udd86 MULAI SPIN!';\n                }\n\n                // scroll track to start\n                if (trackScroll) {\n                    trackScroll.scrollLeft = 0;\n                }\n            }\n\n            // ===== RESET =====\n            function fullReset() {\n                if (isRunning) {\n                    if (animationTimer) ();\n                updateStats();\n                updateAllDoneState();\n                duck.style.left = '0px';\n                duck.classList.remove('walking', 'bounce-stop');\n                startBtn.disabled = false;\n                startBtn.innerHTML = '\ud83e\udd86 MULAI SPIN!';\n                startBtn.classList.remove('running');\n                allDoneMessage.classList.add('hidden');\n                newRoundBtn.classList.add('hidden');\n                isAllDone = false;\n                confettiContainer.innerHTML = '';\n                playClick();\n            }\n\n            // ===== EVENT LISTENERS =====\n            startBtn.addEventListener('click', function() {\n                if (isRunning) return;\n                if (students.length < 2) {\n                    applyStudents();\n                    return;\n                }\n                // if all done and no-repeat, block\n                if (isAllDone && noRepeatMode) {\n                    return;\n                }\n                // init audio context on user interaction\n                initAudio();\n                runSelection();\n            });\n\n            applyBtn.addEventListener('click', function() {\n                if (isRunning) return;\n                applyStudents();\n                playClick();\n            });\n\n            resetBtn.addEventListener('click', function() {\n                if (isRunning) {\n                    if (!confirm('Animasi sedang berjalan. Yakin ingin mereset?')) return;\n                }\n                fullReset();\n            });\n\n            historyResetBtn.addEventListener('click', function() {\n                if (history.length === 0) return;\n                if (!confirm('Hapus semua riwayat pemilihan?')) return;\n                history = [];\n                renderHistory();\n                // also clear selected status if no-repeat mode?\n                // we should keep selected status, just clear history\n                // but we also need to update stats\n                // actually history is separate from selected status\n                playClick();\n            });\n\n            noRepeatCheck.addEventListener('change', function() {\n                noRepeatMode = this.checked;\n                if (noRepeatMode) {\n                    // update UI: mark done items\n                    students.forEach((s, i) => {\n                        if (s.selected) {\n                            const items = track.querySelectorAll('.num-item');\n                            if (items[i]) items[i].classList.add('done');\n                        }\n                    });\n                    updateAllDoneState();\n                    if (isAllDone) {\n                        startBtn.disabled = true;\n                        startBtn.innerHTML = '\ud83c\udf89 SEMUA TERPILIH';\n                    }\n                } else {\n                    // remove done marks (but keep selected data)\n                    document.querySelectorAll('.num-item.done').forEach(el => {\n                        // only remove if not selected? actually we keep selected data\n                        // but we can remove the visual done mark\n                        // we'll re-render\n                        renderTrack();\n                        // but we need to keep selected data\n                        students.forEach((s, i) => {\n                            if (s.selected) {\n                                const items = track.querySelectorAll('.num-item');\n                                if (items[i]) items[i].classList.add('done');\n                            }\n                        });\n                        updateAllDoneState();\n                    });\n                    allDoneMessage.classList.add('hidden');\n                    newRoundBtn.classList.add('hidden');\n                    isAllDone = false;\n                    if (!isRunning) {\n                        startBtn.disabled = false;\n                        startBtn.innerHTML = '\ud83e\udd86 MULAI SPIN!';\n                    }\n                }\n                playClick();\n            });\n\n            newRoundBtn.addEventListener('click', function() {\n                newRound();\n            });\n\n            // ===== KEYBOARD SHORTCUT =====\n            document.addEventListener('keydown', function(e) {\n                if (e.key === 'Enter' && !e.shiftKey && !e.ctrlKey && !e.metaKey) {\n                    const active = document.activeElement;\n                    if (active && active.tagName === 'INPUT' && active.type === 'number') {\n                        return;\n                    }\n                    if (!isRunning && !startBtn.disabled) {\n                        startBtn.click();\n                    }\n                }\n                if (e.key === 'r' || e.key === 'R') {\n                    if (!isRunning && !e.ctrlKey && !e.metaKey) {\n                        resetBtn.click();\n                    }\n                }\n            });\n\n            // ===== ENTER KEY ON INPUT =====\n            studentCountInput.addEventListener('keydown', function(e) {\n                if (e.key === 'Enter') {\n                    applyBtn.click();\n                }\n            });\n\n            // ===== INIT =====\n            function init() {\n                // set initial students\n                const count = 30;\n                studentCountInput.value = count;\n                students = [];\n                for (let i = 1; i <= count; i++) {\n                    students.push({ number: i, selected: false });\n                }\n                renderTrack();\n                renderHistory();\n                updateStats();\n                updateAllDoneState();\n                duck.style.left = '0px';\n\n                // ensure sound state\n                soundIcon.textContent = isSoundOn ? '\ud83d\udd0a' : '\ud83d\udd07';\n                soundLabel.textContent = isSoundOn ? 'ON' : 'OFF';\n            }\n\n            // ===== HANDLE RESIZE =====\n            let resizeTimer;\n            window.addEventListener('resize', function() {\n                clearTimeout(resizeTimer);\n                resizeTimer = setTimeout(() => {\n                    // reposition duck if highlighted\n                    const highlighted = document.querySelector('.num-item.highlight');\n                    if (highlighted) {\n                        const idx = parseInt(highlighted.dataset.index);\n                        if (!isNaN(idx)) {\n                            positionDuckAtIndex(idx);\n                        }\n                    } else {\n                        const selected = document.querySelector('.num-item.selected');\n                        if (selected) {\n                            const idx = parseInt(selected.dataset.index);\n                            if (!isNaN(idx)) {\n                                positionDuckAtIndex(idx);\n                            }\n                        }\n                    }\n                }, 200);\n            });\n\n            // ===== START =====\n            \n            window.addEventListener('message', function(e){\n                var d = e.data || {}; if(d.type !== 'duck-config') return;\n                var t = d.theme || {}, r = document.documentElement.style;\n                ['p','pd','pl','soft','bg','hi','hid','line'].forEach(function(k){ if(t[k]) r.setProperty('--pk-' + k, t[k]); });\n                function rgb(h){ var n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255].join(','); }\n                if(t.p) r.setProperty('--pk-p-rgb', rgb(t.p)); if(t.hi) r.setProperty('--pk-hi-rgb', rgb(t.hi)); if(t.bg) r.setProperty('--pk-bg-rgb', rgb(t.bg));\n                if(d.count){ noRepeatCheck.checked = false; studentCountInput.value = d.count; applyStudents(); setTimeout(function(){ positionDuckAtIndex(0); }, 80); }\n            });\n            try{ parent.postMessage({ type:'duck-ready' }, '*'); }catch(e){}\n            init();\n\n            // Expose for debugging\n            window.__duckPicker = {\n                students: () => students,\n                history: () => history,\n                runSelection,\n                applyStudents,\n                fullReset,\n                newRound\n            };\n\n        })();\n    <\/script>\n\n<\/body>\n<\/html>";

const Sound = {
  on: true, ctx: null,
  init(){ try{ if(!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){} },
  tone(freqs, dur, type, vol){
    if(!this.on) return;
    try{
      this.init(); const now = this.ctx.currentTime;
      freqs.forEach((f, i) => {
        const o = this.ctx.createOscillator(), g = this.ctx.createGain();
        o.type = type || 'sine'; o.frequency.value = f; o.connect(g); g.connect(this.ctx.destination);
        const t0 = now + i * dur;
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(vol || 0.14, t0 + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
        o.start(t0); o.stop(t0 + dur + 0.02);
      });
    }catch(e){}
  },
  click(){ this.tone([620], 0.05, 'triangle'); },
  tick(){ this.tone([900], 0.025, 'sine'); },
  correct(){ this.tone([523, 659, 784], 0.11, 'sine'); },
  wrong(){ this.tone([220, 175], 0.14, 'sawtooth'); },
  countdown(){ this.tone([760], 0.07, 'square', 0.07); },
  kring(){
    if(!this.on) return;
    if(KRING_SOUND_URL){ try{ const a = this._k || (this._k = new Audio(KRING_SOUND_URL)); a.currentTime = 0; const p = a.play(); if(p && p.catch) p.catch(() => this.bell()); return; }catch(e){} }
    this.bell();
  },
  bell(){
    try{
      this.init(); const t0 = this.ctx.currentTime;
      for(let r = 0; r < 9; r++){ [1, 2.76, 5.4, 8.93].forEach((m, i) => {
        const o = this.ctx.createOscillator(), g = this.ctx.createGain(); o.type = 'sine'; o.frequency.value = 1250 * m * (r % 2 ? 1.012 : 1);
        o.connect(g); g.connect(this.ctx.destination); const t = t0 + r * 0.1;
        g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.2 / (i + 1), t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.55);
        o.start(t); o.stop(t + 0.6);
      }); }
    }catch(e){}
  },
  winner(){ this.tone([523, 659, 784, 1047], 0.12, 'sine'); },
  teamWin(){ this.tone([523, 659, 784, 659, 784, 1047, 1319], 0.11, 'triangle'); }
};
